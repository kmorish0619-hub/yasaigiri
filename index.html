<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>まな板の上で</title>
<style>
  :root{
    --hakuji:#f2f6ef;
    --wakana:#8fe044;
    --shu:#ff5a3c;
    --tamago:#ffc63d;
    --mizu:#6fd0ff;
    --accent:#8fe044;
    --font:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#05080a;
    font-family:var(--font);color:var(--hakuji);
    -webkit-user-select:none;user-select:none;overscroll-behavior:none}
  #app{position:fixed;inset:0;touch-action:none;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .layer{position:absolute;inset:0;pointer-events:none}
  #vig{background:
      radial-gradient(115% 80% at 50% 42%, rgba(0,0,0,0) 38%, rgba(0,0,0,.62) 100%),
      linear-gradient(to bottom, rgba(10,30,26,.35), rgba(0,0,0,0) 30%);
    transition:background .6s}
  body.m-tamago #vig{background:
      radial-gradient(115% 80% at 50% 46%, rgba(0,0,0,0) 40%, rgba(24,10,0,.6) 100%),
      linear-gradient(to bottom, rgba(60,38,10,.35), rgba(0,0,0,0) 30%)}
  body.m-sakana #vig{background:
      radial-gradient(115% 80% at 50% 46%, rgba(0,0,0,0) 42%, rgba(0,10,20,.62) 100%),
      linear-gradient(to bottom, rgba(10,34,52,.4), rgba(0,0,0,0) 30%)}
  body.m-tamago{--accent:#ffc63d}
  body.m-sakana{--accent:#6fd0ff}
  #flash{background:#fff;opacity:0;transition:opacity .5s ease-out}

  /* ── HUD ── */
  #hud{opacity:0;transition:opacity .4s}
  #hud.on{opacity:1}
  .score{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;
    font-size:40px;font-weight:800;letter-spacing:.02em;line-height:1;
    text-shadow:0 3px 0 rgba(0,0,0,.45)}
  .score small{display:block;font-size:11px;font-weight:700;opacity:.55;letter-spacing:.28em;margin-bottom:5px}
  .lives{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);right:16px;display:flex;gap:7px}
  .lives.off{display:none}
  .life{width:15px;height:15px;border-radius:50%;background:var(--shu);
    box-shadow:0 0 12px rgba(255,90,60,.6), inset 0 -4px 0 rgba(0,0,0,.25);transition:.25s}
  .life.gone{background:transparent;box-shadow:none;border:2px solid rgba(255,255,255,.22)}
  #timerWrap{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);right:16px;
    width:112px;height:9px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;display:none}
  #timerWrap.on{display:block}
  #timerBar{height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,#6fd0ff,#b9ecff);
    transition:background .3s}
  #timerBar.low{background:linear-gradient(90deg,#ff5a3c,#ffa06f)}
  #stepLabel{position:absolute;top:calc(env(safe-area-inset-top,0px) + 44px);right:16px;
    font-size:13px;font-weight:800;opacity:0;transform:translateX(8px);transition:.25s;
    text-shadow:0 2px 6px rgba(0,0,0,.7)}
  #stepLabel.on{opacity:.92;transform:none}
  #combo{position:absolute;top:calc(env(safe-area-inset-top,0px) + 78px);left:16px;
    font-size:15px;font-weight:800;color:var(--accent);opacity:0;transform:translateY(-6px);
    transition:.18s;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  #combo.on{opacity:1;transform:none}
  #sound{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);right:14px;
    width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.16);
    background:rgba(8,16,14,.5);backdrop-filter:blur(6px);color:#fff;font-size:17px;
    pointer-events:auto;display:grid;place-items:center;opacity:.7}
  #quit{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:14px;
    height:42px;padding:0 16px;border-radius:14px;border:1px solid rgba(255,255,255,.16);
    background:rgba(8,16,14,.5);backdrop-filter:blur(6px);color:#fff;font-size:12px;font-weight:800;
    font-family:var(--font);pointer-events:auto;opacity:.6}
  #hud:not(.on) #sound,#hud:not(.on) #quit{pointer-events:none}
  #hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);
    text-align:center;font-size:12px;font-weight:700;opacity:0;transition:opacity .4s;
    letter-spacing:.08em;text-shadow:0 2px 8px rgba(0,0,0,.8)}
  #hint.on{opacity:.68}

  /* ── 画面 ── */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    align-items:center;padding:26px;pointer-events:auto;
    transition:opacity .45s ease, transform .45s ease}
  .screen.hide{opacity:0;transform:scale(1.06);pointer-events:none}
  .kicker{font-size:11px;font-weight:800;letter-spacing:.42em;color:var(--wakana);
    text-indent:.42em;margin-bottom:14px;opacity:.85}
  h1{margin:0;font-size:clamp(46px,15vw,86px);font-weight:900;line-height:.94;letter-spacing:.04em;
    background:linear-gradient(178deg,#ffffff 8%,#d9f7b0 46%,#8fe044 70%,#4a9c20 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 0 rgba(0,0,0,.35)) drop-shadow(0 0 30px rgba(143,224,68,.28))}
  .romaji{margin-top:10px;font-size:11px;letter-spacing:.5em;text-indent:.5em;opacity:.45;font-weight:700}
  .menu{margin-top:30px;width:min(340px,90vw);display:flex;flex-direction:column;gap:10px}
  .item{display:flex;align-items:center;gap:13px;padding:16px 17px;border-radius:16px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
    font-weight:800;font-size:16px;transition:.16s;pointer-events:auto}
  .item .veg{font-size:23px;line-height:1}
  .item .sub{margin-left:auto;font-size:11px;font-weight:700;opacity:.5;letter-spacing:.08em;text-align:right}
  .item:active{transform:scale(.975)}
  .item.g1{background:linear-gradient(135deg,rgba(143,224,68,.2),rgba(143,224,68,.04));border-color:rgba(143,224,68,.45)}
  .item.g2{background:linear-gradient(135deg,rgba(255,198,61,.2),rgba(255,198,61,.04));border-color:rgba(255,198,61,.45)}
  .item.g3{background:linear-gradient(135deg,rgba(111,208,255,.2),rgba(111,208,255,.04));border-color:rgba(111,208,255,.45)}
  .item.g1 .sub{color:var(--wakana);opacity:.95}
  .item.g2 .sub{color:var(--tamago);opacity:.95}
  .item.g3 .sub{color:var(--mizu);opacity:.95}
  .tip{margin-top:22px;font-size:11px;opacity:.35;font-weight:700;letter-spacing:.1em}

  .btn{margin-top:24px;padding:17px 46px;border:0;border-radius:999px;font-family:var(--font);
    font-size:18px;font-weight:900;letter-spacing:.16em;text-indent:.16em;color:#0a1d0a;
    background:linear-gradient(170deg,#c6f58a,#8fe044 55%,#5cb524);
    box-shadow:0 8px 0 #3b7d16, 0 16px 34px rgba(143,224,68,.32);transition:.12s}
  .btn:active{transform:translateY(5px);box-shadow:0 3px 0 #3b7d16, 0 8px 18px rgba(143,224,68,.25)}
  .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.22);
    box-shadow:none;font-size:14px;padding:13px 30px;margin-top:14px}
  .btn.ghost:active{transform:scale(.96);box-shadow:none}

  #over{background:radial-gradient(90% 60% at 50% 45%,rgba(6,12,10,.72),rgba(3,6,5,.94))}
  #over .big{font-size:clamp(34px,10vw,54px);font-weight:900;letter-spacing:.06em;
    color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.4)}
  #over .rs{margin-top:22px;font-size:66px;font-weight:900;line-height:1;color:var(--accent);
    text-shadow:0 4px 0 rgba(0,0,0,.4)}
  #over .rl{font-size:11px;letter-spacing:.4em;text-indent:.4em;opacity:.55;font-weight:800}
  #over .best{margin-top:16px;font-size:13px;opacity:.6;font-weight:700}
  #over .stats{margin-top:12px;font-size:12px;opacity:.5;font-weight:700;letter-spacing:.06em}

  /* 遊びかた */
  #howto{position:absolute;inset:auto 0 0 0;padding:24px 26px calc(env(safe-area-inset-bottom,0px) + 26px);
    background:linear-gradient(to top,rgba(4,8,7,.97),rgba(4,8,7,.9) 70%,rgba(4,8,7,0));
    transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.9,.3,1);pointer-events:auto}
  #howto.on{transform:none}
  #howto h2{margin:0 0 12px;font-size:20px;font-weight:900;letter-spacing:.04em}
  #howto p{margin:0 0 6px;font-size:13.5px;line-height:1.85;opacity:.8}
  #howto .go{margin-top:18px;width:100%}
  #err{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;
    font-size:14px;line-height:2;background:#05080a}
</style>
</head>
<body class="m-yasai">
<div id="app">
  <canvas id="gl"></canvas>
  <canvas id="splat"></canvas>
  <canvas id="fx"></canvas>
  <div class="layer" id="vig"></div>
  <div class="layer" id="flash"></div>

  <div class="layer" id="hud">
    <div class="score"><small>SCORE</small><span id="scoreVal">0</span></div>
    <div class="lives" id="lives"><i class="life"></i><i class="life"></i><i class="life"></i></div>
    <div id="timerWrap"><div id="timerBar"></div></div>
    <div id="stepLabel"></div>
    <div id="combo"></div>
    <div id="hint"></div>
    <button id="sound">🔊</button>
    <button id="quit">やめる</button>
  </div>

  <div class="screen" id="title">
    <div class="kicker">きょうも まな板の上で</div>
    <h1>まな板の上で</h1>
    <div class="romaji">MANAITA NO UE DE</div>
    <div class="menu">
      <div class="item g1" data-mode="yasai"><span class="veg">🥕</span>やさい斬り<span class="sub">スワイプで斬る</span></div>
      <div class="item g2" data-mode="tamago"><span class="veg">🥚</span>たまご割り<span class="sub">タップで割る</span></div>
      <div class="item g3" data-mode="sakana"><span class="veg">🐟</span>三枚おろし<span class="sub">線をなぞる</span></div>
    </div>
    <div class="tip">タイトル画面でも斬れます</div>
  </div>

  <div class="screen hide" id="over">
    <div class="big" id="overTitle">おしまい</div>
    <div class="rl" style="margin-top:24px">SCORE</div>
    <div class="rs" id="finalScore">0</div>
    <div class="best" id="bestScore">ハイスコア 0</div>
    <div class="stats" id="stats"></div>
    <button class="btn" id="againBtn">もういちど</button>
    <button class="btn ghost" id="homeBtn">タイトルへ</button>
  </div>

  <div id="howto">
    <h2 id="htTitle"></h2>
    <div id="htBody"></div>
    <button class="btn go" id="htGo">はじめる</button>
  </div>

  <div id="err">3Dライブラリを読み込めませんでした。<br>通信環境を確認して、もう一度開いてください。</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(typeof THREE==='undefined'){document.getElementById('err').style.display='grid';return;}

/* ══════════════════════════════════════════
   共通エンジン
   ══════════════════════════════════════════ */
const glCanvas=document.getElementById('gl');
const splatCanvas=document.getElementById('splat');
const fxCanvas=document.getElementById('fx');
const sctx=splatCanvas.getContext('2d');
const fctx=fxCanvas.getContext('2d');

const renderer=new THREE.WebGLRenderer({canvas:glCanvas,antialias:true,alpha:true,powerPreference:'high-performance'});
const DPR=Math.min(window.devicePixelRatio||1,2);
renderer.setPixelRatio(DPR);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x08110e,20,52);
const camera=new THREE.PerspectiveCamera(46,1,0.1,140);

(function(){ // 疑似スタジオ環境光
  const c=document.createElement('canvas');c.width=256;c.height=128;
  const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,0,128);
  grd.addColorStop(0,'#e9f3ff');grd.addColorStop(.45,'#7f95a6');grd.addColorStop(1,'#101a18');
  g.fillStyle=grd;g.fillRect(0,0,256,128);
  const s1=g.createRadialGradient(64,26,2,64,26,44);
  s1.addColorStop(0,'rgba(255,255,255,1)');s1.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=s1;g.fillRect(0,0,256,128);
  const s2=g.createRadialGradient(200,50,2,200,50,52);
  s2.addColorStop(0,'rgba(255,214,150,.85)');s2.addColorStop(1,'rgba(255,214,150,0)');
  g.fillStyle=s2;g.fillRect(0,0,256,128);
  const tex=new THREE.CanvasTexture(c);
  tex.mapping=THREE.EquirectangularReflectionMapping;
  const pm=new THREE.PMREMGenerator(renderer);
  scene.environment=pm.fromEquirectangular(tex).texture;
  pm.dispose();tex.dispose();
})();

scene.add(new THREE.AmbientLight(0x9fb6c8,0.35));
const key=new THREE.DirectionalLight(0xfff4e2,2.5);
key.position.set(6,11,9);key.castShadow=true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.left=-13;key.shadow.camera.right=13;
key.shadow.camera.top=13;key.shadow.camera.bottom=-13;
key.shadow.camera.near=1;key.shadow.camera.far=46;
key.shadow.bias=-0.0012;key.shadow.radius=2.4;
scene.add(key);
const rim=new THREE.DirectionalLight(0x6ee0ff,1.5);
rim.position.set(-8,3,-6);scene.add(rim);
const under=new THREE.DirectionalLight(0x8fe044,0.5);
under.position.set(0,-7,4);scene.add(under);

const backMat=new THREE.MeshStandardMaterial({color:0x14231f,roughness:.95,metalness:0});
const back=new THREE.Mesh(new THREE.PlaneGeometry(100,60),backMat);
back.position.set(0,0,-11);back.receiveShadow=true;scene.add(back);
const glowMat=new THREE.MeshBasicMaterial({color:0x2f6b4e,transparent:true,opacity:.42});
const glow=new THREE.Mesh(new THREE.CircleGeometry(13,48),glowMat);
glow.position.set(0,1.2,-10.7);scene.add(glow);

const dustGeo=new THREE.BufferGeometry();
(function(){
  const N=190,pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*30;pos[i*3+1]=(Math.random()-.5)*20;pos[i*3+2]=(Math.random()-.5)*14-2;}
  dustGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
})();
const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xbfe8d0,size:.055,transparent:true,opacity:.45,depthWrite:false}));
scene.add(dust);

/* ── ジオメトリ生成ヘルパ ── */
function profileOf(fn,h,r,N){
  const p=[];N=N||22;
  for(let i=0;i<=N;i++){const t=i/N;p.push(new THREE.Vector2(Math.max(.0008,fn(t)*r),(t-.5)*h));}
  return p;
}
function faceGeoOf(prof){
  const sh=new THREE.Shape();
  sh.moveTo(prof[0].x,prof[0].y);
  for(let i=1;i<prof.length;i++)sh.lineTo(prof[i].x,prof[i].y);
  for(let i=prof.length-1;i>=0;i--)sh.lineTo(-prof[i].x,prof[i].y);
  sh.closePath();
  const g=new THREE.ShapeGeometry(sh,1);
  g.computeBoundingBox();
  const bb=g.boundingBox,bw=bb.max.x-bb.min.x,bh=bb.max.y-bb.min.y;
  const pa=g.attributes.position,ua=g.attributes.uv;
  for(let i=0;i<pa.count;i++)ua.setXY(i,(pa.getX(i)-bb.min.x)/bw,(pa.getY(i)-bb.min.y)/bh);
  ua.needsUpdate=true;
  g.rotateY(-Math.PI/2);
  return g;
}
function halvesOf(prof,seg){
  seg=seg||22;
  const a=new THREE.LatheGeometry(prof,seg,0,Math.PI);
  const b=new THREE.LatheGeometry(prof,seg,Math.PI,Math.PI);
  a.computeVertexNormals();b.computeVertexNormals();
  return [a,b];
}
function noiseOver(g,S,n,alpha){
  for(let k=0;k<n;k++){g.fillStyle='rgba(0,0,0,'+(Math.random()*alpha)+')';
    g.fillRect(Math.random()*S,Math.random()*S,2,2);}
}
function cvs(S){const c=document.createElement('canvas');c.width=c.height=S;return c;}
function texFrom(c){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;}

/* ── 粒子 ── */
const PMAX=800;
const jPos=new Float32Array(PMAX*3),jCol=new Float32Array(PMAX*3),jBase=new Float32Array(PMAX*3);
const jVel=[],jLife=new Float32Array(PMAX),jMax=new Float32Array(PMAX);
for(let i=0;i<PMAX;i++){jVel.push(new THREE.Vector3());jPos[i*3+1]=-999;}
const jGeo=new THREE.BufferGeometry();
jGeo.setAttribute('position',new THREE.BufferAttribute(jPos,3));
jGeo.setAttribute('color',new THREE.BufferAttribute(jCol,3));
const dotTex=(function(){
  const c=cvs(64),g=c.getContext('2d');
  const rg=g.createRadialGradient(32,32,0,32,32,32);
  rg.addColorStop(0,'rgba(255,255,255,1)');rg.addColorStop(.35,'rgba(255,255,255,.75)');
  rg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=rg;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);
})();
scene.add(new THREE.Points(jGeo,new THREE.PointsMaterial({size:.19,map:dotTex,vertexColors:true,
  transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true})));
let jHead=0;
function burst(pos,color,n,power,dir,spread){
  const c=new THREE.Color(color);
  for(let k=0;k<n;k++){
    const i=jHead;jHead=(jHead+1)%PMAX;
    jPos[i*3]=pos.x;jPos[i*3+1]=pos.y;jPos[i*3+2]=pos.z;
    const v=jVel[i];
    v.set((Math.random()-.5),(Math.random()-.5),(Math.random()-.5)*(spread===undefined?.7:spread))
     .normalize().multiplyScalar(power*(.35+Math.random()));
    if(dir)v.addScaledVector(dir,power*.55*Math.random());
    v.y+=power*.25;
    const f=.75+Math.random()*.6;
    jBase[i*3]=jCol[i*3]=c.r*f;jBase[i*3+1]=jCol[i*3+1]=c.g*f;jBase[i*3+2]=jCol[i*3+2]=c.b*f;
    jMax[i]=jLife[i]=.5+Math.random()*.7;
  }
  jGeo.attributes.position.needsUpdate=true;jGeo.attributes.color.needsUpdate=true;
}

/* ── 音 ── */
let AC=null,muted=false,noiseBuf=null;
function ac(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}
  if(AC.state==='suspended')AC.resume();
  if(!noiseBuf){
    noiseBuf=AC.createBuffer(1,AC.sampleRate*1.2,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  return AC;
}
function noise(dur,type,f0,f1,vol,q){
  const a=ac();if(!a||muted)return;
  const s=a.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const bp=a.createBiquadFilter();bp.type=type;bp.frequency.setValueAtTime(f0,a.currentTime);
  bp.frequency.exponentialRampToValueAtTime(Math.max(40,f1),a.currentTime+dur);
  bp.Q.value=q||1;
  const g=a.createGain();g.gain.setValueAtTime(vol,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0007,a.currentTime+dur);
  s.connect(bp);bp.connect(g);g.connect(a.destination);
  s.start();s.stop(a.currentTime+dur+.02);
}
function tone(f0,f1,dur,vol,type){
  const a=ac();if(!a||muted)return;
  const o=a.createOscillator();o.type=type||'sine';
  o.frequency.setValueAtTime(f0,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),a.currentTime+dur);
  const g=a.createGain();g.gain.setValueAtTime(vol,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0007,a.currentTime+dur);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur+.02);
}
const snd={
  swish(){noise(.13,'bandpass',2600,700,.12,1.4);},
  slice(n){noise(.16,'bandpass',5200,900,.26,1.1);tone(760+n*70,220,.16,.14,'triangle');},
  gold(){tone(880,1760,.18,.16,'triangle');tone(1320,2640,.3,.1,'sine');},
  bomb(){noise(.75,'lowpass',1500,60,.5,1);tone(150,32,.7,.35,'sawtooth');},
  miss(){tone(210,90,.26,.14,'sine');},
  combo(n){[0,1,2].forEach((k,i)=>setTimeout(()=>tone(600+n*60+k*180,900+n*60+k*180,.12,.11,'square'),i*55));},
  ui(){tone(520,880,.1,.1,'triangle');},
  crack(){noise(.09,'highpass',3000,1400,.3,.7);tone(420,160,.1,.12,'square');},

const camUp=new THREE.Vector3(0,1,0),camRight=new THREE.Vector3(1,0,0);
const tmpV=new THREE.Vector3(),tmpU=new THREE.Vector3();
function toScreen(v){
  tmpV.copy(v).project(camera);
  return {x:(tmpV.x*.5+.5)*window.innerWidth,y:(-tmpV.y*.5+.5)*window.innerHeight};
}
function screenRadius(v,r){
  const a=toScreen(v);
  tmpU.copy(v).addScaledVector(camUp,r);
  const b=toScreen(tmpU);
  return Math.hypot(a.x-b.x,a.y-b.y);
}
function segCircle(ax,ay,bx,by,cx,cy,r){
  const dx=bx-ax,dy=by-ay,fx=ax-cx,fy=ay-cy;
  const A=dx*dx+dy*dy;
  if(A<1e-6)return (fx*fx+fy*fy)<=r*r;
  let t=-(fx*dx+fy*dy)/A;t=Math.max(0,Math.min(1,t));
  const px=ax+dx*t-cx,py=ay+dy*t-cy;
  return px*px+py*py<=r*r;
}
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,A=dx*dx+dy*dy;
  let t=A<1e-6?0:((px-ax)*dx+(py-ay)*dy)/A;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-ax-dx*t,py-ay-dy*t);
}

/* ── 2Dレイヤー描画 ── */
function drawTrail(){
  const now=performance.now()/1000;
  while(trail.length&&now-trail[0].t>TRAIL_LIFE)trail.shift();
  const N=trail.length;if(N<3)return;
  fctx.save();fctx.globalCompositeOperation='lighter';
  const passes=[[1,'rgba(90,215,255,.16)'],[.55,'rgba(190,245,255,.34)'],[.2,'rgba(255,255,255,.95)']];
  for(let k=0;k<passes.length;k++){
    const wm=passes[k][0],col=passes[k][1];
    const L=[],R=[];
    for(let i=0;i<N;i++){
      const p=trail[i],q=trail[Math.min(N-1,i+1)],r=trail[Math.max(0,i-1)];
      let dx=q.x-r.x,dy=q.y-r.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
      const age=(now-p.t)/TRAIL_LIFE;
      const tp=Math.pow(i/(N-1),.75)*(1-age*.85);
      const w=Math.max(.3,17*wm*tp);
      L.push([p.x-dy*w,p.y+dx*w]);R.push([p.x+dy*w,p.y-dx*w]);
    }
    fctx.beginPath();fctx.moveTo(L[0][0],L[0][1]);
    for(let i=1;i<L.length;i++)fctx.lineTo(L[i][0],L[i][1]);
    for(let i=R.length-1;i>=0;i--)fctx.lineTo(R[i][0],R[i][1]);
    fctx.closePath();fctx.fillStyle=col;fctx.fill();
  }
  fctx.restore();
}

function cutVeg(it,dir,sc){
  it.dead=true;
  const n=new THREE.Vector3().addScaledVector(camRight,-dir.y).addScaledVector(camUp,-dir.x).normalize();
  const cur=new THREE.Vector3(0,1,0).applyQuaternion(it.grp.quaternion);
  let up=cur.clone().addScaledVector(n,-cur.dot(n));
  if(up.lengthSq()<1e-4)up.set(0,0,1).addScaledVector(n,-n.z);
  up.normalize();
  const f=new THREE.Vector3().crossVectors(n,up).normalize();
  const q=new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(n,up,f));
  it.fA.visible=it.fB.visible=true;
  const sep=1.9+Math.random()*1.1;
  [[it.hA,1],[it.hB,-1]].forEach(function(e){
    const h=e[0],s=e[1];
    root.add(h);h.quaternion.copy(q);

    halves.push({o:h,vel:it.vel.clone().multiplyScalar(.62).addScaledVector(n,s*sep).add(new THREE.Vector3(0,1.2,0)),
      spin:new THREE.Vector3((Math.random()-.5)*7,(Math.random()-.5)*5,(Math.random()-.5)*7),life:3.4});
  });

}
function explode(it){

function slash(a,b){
  const len=Math.hypot(b.x-a.x,b.y-a.y);

    const it=items[i];if(it.dead)continue;
    const sc=toScreen(it.pos),r=screenRadius(it.pos,it.radius)*.92;
    if(!segCircle(a.x,a.y,b.x,b.y,sc.x,sc.y,r))continue;

    cutVeg(it,{x:(b.x-a.x)/len,y:(b.y-a.y)/len},sc);hits++;
  }
  if(hits>0&&state==='play'){

      const n=comboWin.length;maxCombo=Math.max(maxCombo,n);

          addSplat(sc.x,sc.y,0xffd45e,{x:0,y:1},false);
          burst(e.pos,0xffe9a8,22,3);snd.splat();
          popup(e.pos,'われた…','#ffb27a',22);chain=0;loseLife();
        }
        continue;
      }
      const pr=predictX(e);
      if(pr&&pr.t<gbest){gbest=pr.t;guide={e:e,pr:pr};}
    }
    /* 落下地点マーカー */
    if(guide&&state==='play'){
      mark.visible=true;
      mark.position.set(guide.pr.x,TABLE_Y+.03,guide.pr.z);
      const ok=Math.abs(guide.pr.x)<BOWL_R*.98&&Math.abs(guide.pr.z)<BOWL_R;
      const perfect=Math.abs(guide.pr.x)<BOWL_R*.36;
      markMat.color.setHex(perfect?0xffe27a:(ok?0x7dff8a:0xffffff));
      markMat.opacity=ok?.95:.5;
      const s=1+(ok?Math.sin(elapsed*14)*.07:0);
      mark.scale.setScalar(s);
      MODES.tamago._guide=guide;
    }else{mark.visible=false;MODES.tamago._guide=null;}
    /* 黄身 */
    for(let i=yolks.length-1;i>=0;i--){
      const y=yolks[i];
      if(!y.landed){
        y.vel.y-=EG*.92*dt;
        y.pos.addScaledVector(y.vel,dt);
        y.o.position.copy(y.pos);
        y.o.rotation.y+=dt*2;
        const sq=1+Math.min(.3,Math.abs(y.vel.y)*.02);
        y.o.scale.set(1/sq*1.05,sq,1/sq*1.05);
        if(y.pos.y<TABLE_Y+.75){y.landed=true;land(y);}
      }else{
        y.wob+=dt;
        if(y.wob>.6){root.remove(y.o);yolks.splice(i,1);}
      }
    }
    /* から */
    for(let i=shells.length-1;i>=0;i--){
      const s=shells[i];
      s.vel.y-=EG*dt;
      s.o.position.addScaledVector(s.vel,dt);
      s.o.rotation.x+=s.spin.x*dt;s.o.rotation.y+=s.spin.y*dt;s.o.rotation.z+=s.spin.z*dt;
      if(s.o.position.y<TABLE_Y+.12){
        s.o.position.y=TABLE_Y+.12;
        s.vel.y*=-.32;s.vel.x*=.6;s.vel.z*=.6;s.spin.multiplyScalar(.4);
        if(Math.abs(s.vel.y)<.6)s.vel.y=0;
      }
      s.life-=dt;
      if(s.life<0){root.remove(s.o);shells.splice(i,1);}
    }
    /* ボウルの中身のゆらぎ */
    if(pile.visible){
      const k=Math.min(1,inBowl/14);
      pile.scale.y=(.13+k*.4)*(1+Math.sin(elapsed*6)*.04);
    }
    /* カメラ */
    const t=elapsed;
    let fy=0,fn=0;
    for(const y of yolks)if(!y.landed){fy+=y.pos.x;fn++;}
    const fx=fn?fy/fn:0;
    camWant.set(Math.sin(t*.19)*.9+fx*.12,-.2+Math.sin(t*.26)*.35,ARC.z*.9+Math.sin(t*.15)*.6-dolly*1.6);
    lookAt.set(fx*.22,-1.9+Math.sin(t*.21)*.2,0);
    lookWant.copy(lookAt);
    fovWant=46-dolly*2;
    dolly=fn?Math.min(1,dolly+raw*1.6):Math.max(0,dolly-raw*1.4);
    camLag=2.2;
  },
  draw2d(){
    const g=MODES.tamago._guide;
    if(!g||!mark.visible)return;
    const a=toScreen(g.e.pos),b=toScreen(mark.position);
    fctx.save();
    fctx.setLineDash([7,9]);fctx.lineWidth=2;
    fctx.strokeStyle=markMat.color.getStyle();
    fctx.globalAlpha=.55;
    fctx.beginPath();fctx.moveTo(a.x,a.y);fctx.lineTo(b.x,b.y);fctx.stroke();
    fctx.restore();
  },
  overStats(){return 'ボウルに '+inBowl+'個　ドンピシャ '+perfects+'回　最高 '+bestChain+'れんぞく';}
};
})();

const FN=t=>Math.pow(Math.sin(Math.PI*t),.6)*(.7+.55*t);

const bodyProf=sub(0,HI,false,true);

function finShape(pts){

const gTail=finShape([[-2.3,0],[-3.3,.9],[-3.0,0],[-3.3,-.9]]);

/* ステップ定義（fish.grp ローカル座標） */
const STEPS=[
  {label:'① 頭を落とす',key:'head',
   a:new THREE.Vector3(NECK_X,1.05,.15),b:new THREE.Vector3(NECK_X,-1.05,.15),
   cam:{p:new THREE.Vector3(1.5,.75,6.3),l:new THREE.Vector3(1.15,-.35,0),f:41}},
  {label:'② 上身をはがす',key:'upper',
   a:new THREE.Vector3(NECK_X-.1,.05,.2),b:new THREE.Vector3(-2.15,.05,.2),
   cam:{p:new THREE.Vector3(-.15,1.15,8.5),l:new THREE.Vector3(-.25,-.5,0),f:44}},
  {label:'③ 裏返して下身',key:'lower',
   a:new THREE.Vector3(NECK_X-.1,.05,.2),b:new THREE.Vector3(-2.15,.05,.2),
   cam:{p:new THREE.Vector3(-.15,.35,8.3),l:new THREE.Vector3(-.25,-.45,0),f:44}}
];

let fish=null,step=0,busy=false,timeLeft=70,done=0,gradeSum=0,perfect=0;
let path=[],cutting=false,flipT=-1,pull=0,intro=0;
const tweens=[];
function tw(o,p1,r1,dur,delay,onEnd){
  tweens.push({o,p0:o.position.clone(),p1,r0:o.rotation.clone(),r1:r1||o.rotation.clone(),
    t:-(delay||0),dur,onEnd});
}
function updateTweens(dt){
  for(let i=tweens.length-1;i>=0;i--){
    const w=tweens[i];w.t+=dt;
    if(w.t<0)continue;
    const k=Math.min(1,w.t/w.dur),e=1-Math.pow(1-k,3);
    w.o.position.lerpVectors(w.p0,w.p1,e);
    w.o.rotation.set(w.r0.x+(w.r1.x-w.r0.x)*e,w.r0.y+(w.r1.y-w.r0.y)*e,w.r0.z+(w.r1.z-w.r0.z)*e);
    if(k>=1){if(w.onEnd)w.onEnd();tweens.splice(i,1);}
  }
}
function guideWorld(i){
  const s=STEPS[step];
  const a=fish.grp.localToWorld(s.a.clone()),b=fish.grp.localToWorld(s.b.clone());
  return i===0?a:b;
}
function guidePoints(n){
  const a=guideWorld(0),b=guideWorld(1),out=[];
  for(let i=0;i<n;i++)out.push(a.clone().lerp(b,i/(n-1)));
  return out;
}
function newFish(){
  if(fish)root.remove(fish.grp);
  fish=makeFish();

}
function evaluate(){
  if(!path.length||busy)return;
  const gp=guidePoints(14);
  const sp=gp.map(p=>toScreen(p));
  let sum=0,cov=0;
  for(const s of sp){
    let d=1e9;
    for(let i=1;i<path.length;i++)d=Math.min(d,segDist(s.x,s.y,path[i-1].x,path[i-1].y,path[i].x,path[i].y));
    sum+=Math.min(d,140);if(d<105)cov++;
  }
  const coverage=cov/sp.length, dMean=sum/sp.length;
  path=[];cutting=false;
  if(coverage<.55){
    snd.miss();shakeAdd(.3);
    banner('線からズレてる！','#ff9d7a');
    hint('点線を上からなぞる',1.6);
    return;
  }

  doCut(acc);
}
function grade(acc){
  if(acc>.86)return {t:'達人おろし',m:2.2,c:'#ffe27a'};
  if(acc>.66)return {t:'きれい',m:1.5,c:'#b6ffcf'};
  if(acc>.42)return {t:'まあまあ',m:1.0,c:'#e8f3ff'};
  return {t:'身くずれ…',m:.4,c:'#ff9d7a'};
}
function doCut(acc){
  const g=grade(acc);
  const pts=Math.round(90*g.m);
  addScore(pts);gradeSum+=acc;
  if(acc>.86)perfect++;

  const mid=guideWorld(0).clone().lerp(guideWorld(1),.5);
  popup(mid.clone().setY(mid.y+.9),g.t+' +'+pts,g.c,g.t==='達人おろし'?32:26);
  banner(Math.round(acc*100)+'% '+g.t,g.c);
  snd.chop();snd.knife();
  burst(mid,0xffd9cf,26,3.4,null,1.4);
  shakeAdd(.35+ (1-acc)*.4);
  if(acc>.86){snd.good(1);slowmo(.4,.7);}
  const s=STEPS[step];
  if(s.key==='head'){
    fish.neck.visible=true;fish.bodyNeck.visible=true;
    const h=fish.head;
    fish.grp.remove(h);root.add(h);
    h.position.copy(fish.grp.position);
    tw(h,new THREE.Vector3(2.5,BOARD_Y+.42,1.2),new THREE.Euler(0,0,-.5),.55,0,function(){
      snd.plop();
    });

    setTimeout(()=>{busy=false;},560);
  }else{
    const isUp=s.key==='upper';
    const piece=isUp?fish.upper:fish.lower;
    if(isUp)fish.faceUp.visible=true;else fish.faceLo.visible=true;
    fish.boneMesh.visible=true;
    const wp=new THREE.Vector3();piece.getWorldPosition(wp);
    fish.rest.remove(piece);root.add(piece);
    piece.position.copy(wp);
    piece.rotation.copy(fish.rest.rotation);
    const dz=isUp?2.15:-2.15;
    tw(piece,new THREE.Vector3(wp.x,wp.y+1.15,wp.z+dz*.35),null,.3,0,function(){
      tw(piece,new THREE.Vector3(-.1,BOARD_Y+.5,dz),new THREE.Euler(isUp?Math.PI:0,0,0),.45,0,function(){snd.plop();});
    });

      step=2;setStep(STEPS[2].label);
      flipT=0;
      setTimeout(()=>{busy=false;},1250);
    }else{
      // 完成
      done++;timeLeft=Math.min(99,timeLeft+7);
      const bonus=200+ (acc>.86?120:0);
      addScore(bonus);
      banner('三枚おろし！ +'+bonus,'#6fd0ff');
      snd.good(3);whiteFlash(.25);
      pull=1;
      setStep('');
      setTimeout(function(){
        if(state!=='play')return;
        tweens.length=0;
        root.children.slice().forEach(function(c){
          if(c!==counter&&c!==board&&c!==fish.grp)if(c.type==='Group')root.remove(c);
        });
        newFish();
      },1150);
    }
  }
}
function clear(){
  tweens.length=0;
  root.children.slice().forEach(function(c){if(c!==counter&&c!==board)root.remove(c);});
  fish=null;path=[];cutting=false;busy=false;flipT=-1;pull=0;
  done=0;gradeSum=0;perfect=0;
}

MODES.sakana={
  id:'sakana',label:'三枚おろし',root:root,
  theme:{id:'sakana',back:0x11242f,glow:0x1d5878,fog:0x061016,under:0x6fd0ff,rim:0x9fe6ff},
  uses:{lives:false,timer:true},
  howto:'<p>点線の上をなぞって包丁を入れる。<b>①頭 → ②上身 → ③下身</b>の三手。</p><p>線からのズレが少ないほど高得点。ズレると身くずれ。</p><p>制限時間は70秒。一匹おろすたびに7秒追加。</p>',
  enter(){

    timerBar.style.width='100%';timerBar.classList.remove('low');
  },

  onMove(a,b){

    if(path.length>90)path.shift();
    const e=toScreen(guideWorld(1));

  },
  onUp(){if(cutting)evaluate();},
  update(dt,raw){

    if(pull>0){
      camWant.set(Math.sin(t*.3)*.5,1.9,9.4);
      lookWant.set(0,-.7,0);fovWant=46;
      pull=Math.max(0,pull-raw*.9);
    }else{
      camWant.set(s.p.x+Math.sin(t*.27)*.42,s.p.y+Math.sin(t*.19)*.22,s.p.z+Math.sin(t*.16)*.4);
      lookWant.copy(s.l);
      fovWant=s.f;
    }
    camLag=2.6;
  },
  draw2d(){
    if(!fish||busy||state!=='play')return;
    const a=toScreen(guideWorld(0)),b=toScreen(guideWorld(1));
    const ph=(elapsed*1.6)%1;
    fctx.save();
    fctx.lineCap='round';
    fctx.strokeStyle='rgba(0,0,0,.45)';fctx.lineWidth=9;
    fctx.setLineDash([12,12]);fctx.lineDashOffset=-elapsed*40;
    fctx.beginPath();fctx.moveTo(a.x,a.y);fctx.lineTo(b.x,b.y);fctx.stroke();
    fctx.strokeStyle='rgba(140,225,255,.95)';fctx.lineWidth=4;
    fctx.beginPath();fctx.moveTo(a.x,a.y);fctx.lineTo(b.x,b.y);fctx.stroke();
    fctx.setLineDash([]);
    // 進行方向のヒカリ
    const hx=a.x+(b.x-a.x)*ph,hy=a.y+(b.y-a.y)*ph;
    const gr=fctx.createRadialGradient(hx,hy,0,hx,hy,26);
    gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(1,'rgba(255,255,255,0)');
    fctx.fillStyle=gr;fctx.beginPath();fctx.arc(hx,hy,26,0,6.283);fctx.fill();
    // 始点
    const r=13+Math.sin(elapsed*7)*2.6;
    fctx.strokeStyle='#fff';fctx.lineWidth=3;
    fctx.beginPath();fctx.arc(a.x,a.y,r,0,6.283);fctx.stroke();
    // 終点の矢印
    const ang=Math.atan2(b.y-a.y,b.x-a.x);
    fctx.translate(b.x,b.y);fctx.rotate(ang);
    fctx.fillStyle='rgba(140,225,255,.95)';
    fctx.beginPath();fctx.moveTo(14,0);fctx.lineTo(-6,9);fctx.lineTo(-6,-9);fctx.closePath();fctx.fill();
    fctx.restore();
  },
  overStats(){
    const avg=done+step>0?Math.round(gradeSum/Math.max(1,done*3+step)*100):0;
    return 'おろした魚 '+done+'匹　平均 '+avg+'%　達人 '+perfect+'回';
  }
};
})();

/* ══════════════════════════════════════════
   UI配線とメインループ
   ══════════════════════════════════════════ */
document.querySelectorAll('.item[data-mode]').forEach(function(el){
  el.addEventListener('click',function(){openHowto(el.getAttribute('data-mode'));});
});
document.getElementById('htGo').onclick=function(){if(pendingMode)startMode(pendingMode);};
document.getElementById('againBtn').onclick=function(){startMode(mode.id);};
document.getElementById('homeBtn').onclick=toTitle;
document.getElementById('quit').onclick=function(){
  if(state==='play')gameOver('とちゅうでやめた');else toTitle();
};
document.getElementById('sound').onclick=function(){
  muted=!muted;this.textContent=muted?'🔇':'🔊';this.style.opacity=muted?.4:.7;
};
titleScreen.addEventListener('click',function(e){
  if(howto.classList.contains('on')&&!e.target.closest('.item'))howto.classList.remove('on');
});

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let raw=Math.min(.05,(now-last)/1000);last=now;
  timeScale+=(tsTarget-timeScale)*(1-Math.exp(-8*raw));
  if(elapsed>slowUntil)tsTarget=1;
  const dt=raw*timeScale;
  elapsed+=dt;

  if(mode)mode.update(dt,raw);

  /* 粒子 */
  let dirty=false;
  for(let i=0;i<PMAX;i++){
    if(jLife[i]<=0)continue;
    jLife[i]-=raw;dirty=true;
    if(jLife[i]<=0){jPos[i*3+1]=-999;jCol[i*3]=jCol[i*3+1]=jCol[i*3+2]=0;continue;}
    const v=jVel[i];v.y-=G*.55*dt;v.multiplyScalar(1-Math.min(.4,1.1*dt));
    jPos[i*3]+=v.x*dt;jPos[i*3+1]+=v.y*dt;jPos[i*3+2]+=v.z*dt;
    const k=jLife[i]/jMax[i],f=k*k;
    jCol[i*3]=jBase[i*3]*f;jCol[i*3+1]=jBase[i*3+1]*f;jCol[i*3+2]=jBase[i*3+2]*f;
  }
  if(dirty){jGeo.attributes.position.needsUpdate=true;jGeo.attributes.color.needsUpdate=true;}
  dust.rotation.y+=raw*.02;

  /* カメラ（減衰補間＋シェイク） */
  if(camSnap){camCur.copy(camWant);lookCur.copy(lookWant);fovCur=fovWant;camSnap=false;}
  const kp=1-Math.exp(-camLag*raw), kl=1-Math.exp(-(camLag*.8)*raw);
  camCur.x+=(camWant.x-camCur.x)*kp;
  camCur.y+=(camWant.y-camCur.y)*kp;
  camCur.z+=(camWant.z-camCur.z)*(1-Math.exp(-(camLag*1.35)*raw));
  lookCur.x+=(lookWant.x-lookCur.x)*kl;
  lookCur.y+=(lookWant.y-lookCur.y)*kl;
  lookCur.z+=(lookWant.z-lookCur.z)*kl;
  shake*=Math.exp(-5.5*raw);
  const sh=shake*shake;
  camera.position.set(camCur.x+(Math.random()-.5)*sh*.9,
                      camCur.y+(Math.random()-.5)*sh*.9,
                      camCur.z+(Math.random()-.5)*sh*.4);
  camera.lookAt(lookCur);
  const fw=fovWant+sh*2.2;
  fovCur+=(fw-fovCur)*(1-Math.exp(-4*raw));
  if(Math.abs(camera.fov-fovCur)>.01){camera.fov=fovCur;camera.updateProjectionMatrix();}
  camRight.set(1,0,0).applyQuaternion(camera.quaternion);
  camUp.set(0,1,0).applyQuaternion(camera.quaternion);

  /* HUD */
  if(shown!==score){
    shown+=Math.max(1,Math.ceil((score-shown)*.22));
    if(shown>score)shown=score;
    scoreVal.textContent=shown;
  }
  if(elapsed>comboUntil)comboEl.classList.remove('on');
  if(elapsed>hintUntil)hintEl.classList.remove('on');

  renderer.render(scene,camera);

  fctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  fadeSplats(raw);
  if(mode&&mode.draw2d)mode.draw2d();
  drawPopups(raw);
  drawTrail();
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)last=performance.now();});

toTitle();
requestAnimationFrame(frame);
})();
</script>
