<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>スッキリ三番勝負</title>
<style>
  :root{
    --hakuji:#f2f6ef;
    --wakana:#8fe044;
    --shu:#ff5a3c;
    --tamago:#ffc63d;
    --mizu:#6fd0ff;
    --accent:#8fe044;
    --font:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#05080a;
    font-family:var(--font);color:var(--hakuji);
    -webkit-user-select:none;user-select:none;overscroll-behavior:none}
  #app{position:fixed;inset:0;touch-action:none;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .layer{position:absolute;inset:0;pointer-events:none}
  #vig{background:
      radial-gradient(115% 80% at 50% 42%, rgba(0,0,0,0) 38%, rgba(0,0,0,.62) 100%),
      linear-gradient(to bottom, rgba(10,30,26,.35), rgba(0,0,0,0) 30%);
    transition:background .6s}
  body.m-homerun #vig{background:
      radial-gradient(115% 80% at 50% 44%, rgba(0,0,0,0) 44%, rgba(0,12,20,.6) 100%),
      linear-gradient(to bottom, rgba(12,40,56,.34), rgba(0,0,0,0) 30%)}
  body.m-racing #vig{background:
      radial-gradient(120% 82% at 50% 50%, rgba(0,0,0,0) 34%, rgba(2,4,16,.72) 100%),
      linear-gradient(to bottom, rgba(28,20,70,.4), rgba(0,0,0,0) 26%)}
  body.m-homerun{--accent:#ffe27a}
  body.m-racing{--accent:#6fd0ff}
  #flash{background:#fff;opacity:0;transition:opacity .5s ease-out}

  /* ── HUD ── */
  #hud{opacity:0;transition:opacity .4s}
  #hud.on{opacity:1}
  .score{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;
    font-size:40px;font-weight:800;letter-spacing:.02em;line-height:1;
    text-shadow:0 3px 0 rgba(0,0,0,.45)}
  .score small{display:block;font-size:11px;font-weight:700;opacity:.55;letter-spacing:.28em;margin-bottom:5px}
  .lives{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);right:16px;display:flex;gap:7px}
  .lives.off{display:none}
  .life{width:15px;height:15px;border-radius:50%;background:var(--shu);
    box-shadow:0 0 12px rgba(255,90,60,.6), inset 0 -4px 0 rgba(0,0,0,.25);transition:.25s}
  .life.gone{background:transparent;box-shadow:none;border:2px solid rgba(255,255,255,.22)}
  #timerWrap{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);right:16px;
    width:112px;height:9px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;display:none}
  #timerWrap.on{display:block}
  #timerBar{height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,#6fd0ff,#b9ecff);
    transition:background .3s}
  #timerBar.low{background:linear-gradient(90deg,#ff5a3c,#ffa06f)}
  #stepLabel{position:absolute;top:calc(env(safe-area-inset-top,0px) + 44px);right:16px;
    font-size:13px;font-weight:800;opacity:0;transform:translateX(8px);transition:.25s;
    text-shadow:0 2px 6px rgba(0,0,0,.7)}
  #stepLabel.on{opacity:.92;transform:none}
  #combo{position:absolute;top:calc(env(safe-area-inset-top,0px) + 78px);left:16px;
    font-size:15px;font-weight:800;color:var(--accent);opacity:0;transform:translateY(-6px);
    transition:.18s;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  #combo.on{opacity:1;transform:none}
  #sys{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;
    transform:translateX(-50%);display:flex;gap:7px}
  #sys button{height:34px;border-radius:11px;border:1px solid rgba(255,255,255,.15);
    background:rgba(8,14,18,.55);backdrop-filter:blur(6px);color:#fff;font-size:12px;font-weight:800;
    font-family:var(--font);pointer-events:auto;opacity:.62;display:grid;place-items:center}
  #sound{width:34px;font-size:15px}
  #quit{padding:0 13px}
  #quit.warn{opacity:1;color:#ff9d7a;border-color:rgba(255,157,122,.6)}
  #hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);
    text-align:center;font-size:12px;font-weight:700;opacity:0;transition:opacity .4s;
    letter-spacing:.08em;text-shadow:0 2px 8px rgba(0,0,0,.8)}
  #hint.on{opacity:.68}

  /* ── 画面 ── */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    align-items:center;padding:26px;pointer-events:auto;visibility:visible;
    transition:opacity .45s ease, transform .45s ease, visibility 0s linear .45s}
  .screen.hide{opacity:0;transform:scale(1.06);pointer-events:none;visibility:hidden}
  .screen.hide *{pointer-events:none !important}
  .kicker{font-size:11px;font-weight:800;letter-spacing:.42em;color:var(--wakana);
    text-indent:.42em;margin-bottom:14px;opacity:.85}
  h1{margin:0;font-size:clamp(42px,13vw,74px);font-weight:900;line-height:1.02;text-align:center;letter-spacing:.04em;
    background:linear-gradient(178deg,#ffffff 8%,#d9f7b0 46%,#8fe044 70%,#4a9c20 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 0 rgba(0,0,0,.35)) drop-shadow(0 0 30px rgba(143,224,68,.28))}
  .romaji{margin-top:10px;font-size:11px;letter-spacing:.5em;text-indent:.5em;opacity:.45;font-weight:700}
  .menu{margin-top:30px;width:min(340px,90vw);display:flex;flex-direction:column;gap:10px}
  .item{display:flex;align-items:center;gap:13px;padding:16px 17px;border-radius:16px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
    font-weight:800;font-size:16px;transition:.16s}
  .item .veg{font-size:23px;line-height:1}
  .item .sub{margin-left:auto;font-size:10.5px;font-weight:700;opacity:.5;letter-spacing:.06em;text-align:right;line-height:1.4}
  .item:active{transform:scale(.975)}
  .item.g1{background:linear-gradient(135deg,rgba(143,224,68,.2),rgba(143,224,68,.04));border-color:rgba(143,224,68,.45)}
  .item.g2{background:linear-gradient(135deg,rgba(255,198,61,.2),rgba(255,198,61,.04));border-color:rgba(255,198,61,.45)}
  .item.g3{background:linear-gradient(135deg,rgba(111,208,255,.2),rgba(111,208,255,.04));border-color:rgba(111,208,255,.45)}
  .item.g1 .sub{color:var(--wakana);opacity:.95}
  .item.g2 .sub{color:var(--tamago);opacity:.95}
  .item.g3 .sub{color:var(--mizu);opacity:.95}
  .tip{margin-top:22px;font-size:11px;opacity:.35;font-weight:700;letter-spacing:.1em}

  .btn{margin-top:24px;padding:17px 46px;border:0;border-radius:999px;font-family:var(--font);
    font-size:18px;font-weight:900;letter-spacing:.16em;text-indent:.16em;color:#0a1d0a;
    background:linear-gradient(170deg,#c6f58a,#8fe044 55%,#5cb524);
    box-shadow:0 8px 0 #3b7d16, 0 16px 34px rgba(143,224,68,.32);transition:.12s}
  .btn:active{transform:translateY(5px);box-shadow:0 3px 0 #3b7d16, 0 8px 18px rgba(143,224,68,.25)}
  .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.22);
    box-shadow:none;font-size:14px;padding:13px 30px;margin-top:14px}
  .btn.ghost:active{transform:scale(.96);box-shadow:none}

  #over{background:radial-gradient(90% 60% at 50% 45%,rgba(6,12,10,.72),rgba(3,6,5,.94))}
  #over .big{font-size:clamp(34px,10vw,54px);font-weight:900;letter-spacing:.06em;
    color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.4)}
  #over .rs{margin-top:22px;font-size:66px;font-weight:900;line-height:1;color:var(--accent);
    text-shadow:0 4px 0 rgba(0,0,0,.4)}
  #over .rl{font-size:11px;letter-spacing:.4em;text-indent:.4em;opacity:.55;font-weight:800}
  #over .best{margin-top:16px;font-size:13px;opacity:.6;font-weight:700}
  #over .stats{margin-top:12px;font-size:12px;opacity:.5;font-weight:700;letter-spacing:.06em}

  /* 遊びかた */
  #howto{position:absolute;inset:auto 0 0 0;padding:24px 26px calc(env(safe-area-inset-bottom,0px) + 26px);
    background:linear-gradient(to top,rgba(4,8,7,.97),rgba(4,8,7,.9) 70%,rgba(4,8,7,0));
    transform:translateY(102%);visibility:hidden;pointer-events:none;
    transition:transform .38s cubic-bezier(.2,.9,.3,1), visibility 0s linear .38s}
  #howto.on{transform:none;visibility:visible;pointer-events:auto;transition:transform .38s cubic-bezier(.2,.9,.3,1)}
  #howto h2{margin:0 0 12px;font-size:20px;font-weight:900;letter-spacing:.04em}
  #howto p{margin:0 0 6px;font-size:13.5px;line-height:1.85;opacity:.8}
  #howto .go{margin-top:18px;width:100%}
  #err{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;
    font-size:14px;line-height:2;background:#05080a}
</style>
</head>
<body class="m-yasai">
<div id="app">
  <canvas id="gl"></canvas>
  <canvas id="splat"></canvas>
  <canvas id="fx"></canvas>
  <div class="layer" id="vig"></div>
  <div class="layer" id="flash"></div>

  <div class="layer" id="hud">
    <div class="score"><small>SCORE</small><span id="scoreVal">0</span></div>
    <div class="lives" id="lives"><i class="life"></i><i class="life"></i><i class="life"></i></div>
    <div id="timerWrap"><div id="timerBar"></div></div>
    <div id="stepLabel"></div>
    <div id="combo"></div>
    <div id="hint"></div>
    <div id="sys"><button id="quit">やめる</button><button id="sound">🔊</button></div>
  </div>

  <div class="screen" id="title">
    <div class="kicker">きょうも たまっている</div>
    <h1>スッキリ<br>三番勝負</h1>
    <div class="romaji">SUKKIRI SANBAN SHOBU</div>
    <div class="menu">
      <div class="item g1" data-mode="yasai"><span class="veg">🥕</span>やさい斬り<span class="sub">斬りきざんで<br>スッキリ</span></div>
      <div class="item g2" data-mode="homerun"><span class="veg">🥎</span>ホームラン<span class="sub">かっとばして<br>スッキリ</span></div>
      <div class="item g3" data-mode="racing"><span class="veg">🏎️</span>ぶち抜きレース<span class="sub">ぶち抜いて<br>スッキリ</span></div>
    </div>
    <div class="tip">タイトル画面でも斬れます</div>
  </div>

  <div class="screen hide" id="over">
    <div class="big" id="overTitle">おしまい</div>
    <div class="rl" style="margin-top:24px">SCORE</div>
    <div class="rs" id="finalScore">0</div>
    <div class="best" id="bestScore">ハイスコア 0</div>
    <div class="stats" id="stats"></div>
    <button class="btn" id="againBtn">もういちど</button>
    <button class="btn ghost" id="homeBtn">タイトルへ</button>
  </div>

  <div id="howto">
    <h2 id="htTitle"></h2>
    <div id="htBody"></div>
    <button class="btn go" id="htGo">はじめる</button>
  </div>

  <div id="err">3Dライブラリを読み込めませんでした。<br>通信環境を確認して、もう一度開いてください。</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(typeof THREE==='undefined'){document.getElementById('err').style.display='grid';return;}

/* ══════════════════════════════════════════
   共通エンジン
   ══════════════════════════════════════════ */
const glCanvas=document.getElementById('gl');
const splatCanvas=document.getElementById('splat');
const fxCanvas=document.getElementById('fx');
const sctx=splatCanvas.getContext('2d');
const fctx=fxCanvas.getContext('2d');

const renderer=new THREE.WebGLRenderer({canvas:glCanvas,antialias:true,alpha:true,powerPreference:'high-performance'});
const DPR=Math.min(window.devicePixelRatio||1,1.75);
renderer.setPixelRatio(DPR);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x08110e,20,52);
const camera=new THREE.PerspectiveCamera(46,1,0.3,620);

(function(){ // 疑似スタジオ環境光
  const c=document.createElement('canvas');c.width=256;c.height=128;
  const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,0,128);
  grd.addColorStop(0,'#e9f3ff');grd.addColorStop(.45,'#7f95a6');grd.addColorStop(1,'#101a18');
  g.fillStyle=grd;g.fillRect(0,0,256,128);
  const s1=g.createRadialGradient(64,26,2,64,26,44);
  s1.addColorStop(0,'rgba(255,255,255,1)');s1.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=s1;g.fillRect(0,0,256,128);
  const s2=g.createRadialGradient(200,50,2,200,50,52);
  s2.addColorStop(0,'rgba(255,214,150,.85)');s2.addColorStop(1,'rgba(255,214,150,0)');
  g.fillStyle=s2;g.fillRect(0,0,256,128);
  const tex=new THREE.CanvasTexture(c);
  tex.mapping=THREE.EquirectangularReflectionMapping;
  const pm=new THREE.PMREMGenerator(renderer);
  scene.environment=pm.fromEquirectangular(tex).texture;
  pm.dispose();tex.dispose();
})();

scene.add(new THREE.AmbientLight(0x9fb6c8,0.35));
const key=new THREE.DirectionalLight(0xfff4e2,2.5);
key.position.set(6,11,9);key.castShadow=true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.left=-13;key.shadow.camera.right=13;
key.shadow.camera.top=13;key.shadow.camera.bottom=-13;
key.shadow.camera.near=1;key.shadow.camera.far=46;
key.shadow.bias=-0.0012;key.shadow.radius=2.4;
scene.add(key);
const rim=new THREE.DirectionalLight(0x6ee0ff,1.5);
rim.position.set(-8,3,-6);scene.add(rim);
const under=new THREE.DirectionalLight(0x8fe044,0.5);
under.position.set(0,-7,4);scene.add(under);

const backMat=new THREE.MeshStandardMaterial({color:0x14231f,roughness:.95,metalness:0});
const back=new THREE.Mesh(new THREE.PlaneGeometry(100,60),backMat);
back.position.set(0,0,-11);back.receiveShadow=true;scene.add(back);
const glowMat=new THREE.MeshBasicMaterial({color:0x2f6b4e,transparent:true,opacity:.42});
const glow=new THREE.Mesh(new THREE.CircleGeometry(13,48),glowMat);
glow.position.set(0,1.2,-10.7);scene.add(glow);

const dustGeo=new THREE.BufferGeometry();
(function(){
  const N=190,pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*30;pos[i*3+1]=(Math.random()-.5)*20;pos[i*3+2]=(Math.random()-.5)*14-2;}
  dustGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
})();
const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xbfe8d0,size:.055,transparent:true,opacity:.45,depthWrite:false}));
scene.add(dust);

/* ── ジオメトリ生成ヘルパ ── */
function profileOf(fn,h,r,N){
  const p=[];N=N||22;
  for(let i=0;i<=N;i++){const t=i/N;p.push(new THREE.Vector2(Math.max(.0008,fn(t)*r),(t-.5)*h));}
  return p;
}
function faceGeoOf(prof){
  const sh=new THREE.Shape();
  sh.moveTo(prof[0].x,prof[0].y);
  for(let i=1;i<prof.length;i++)sh.lineTo(prof[i].x,prof[i].y);
  for(let i=prof.length-1;i>=0;i--)sh.lineTo(-prof[i].x,prof[i].y);
  sh.closePath();
  const g=new THREE.ShapeGeometry(sh,1);
  g.computeBoundingBox();
  const bb=g.boundingBox,bw=bb.max.x-bb.min.x,bh=bb.max.y-bb.min.y;
  const pa=g.attributes.position,ua=g.attributes.uv;
  for(let i=0;i<pa.count;i++)ua.setXY(i,(pa.getX(i)-bb.min.x)/bw,(pa.getY(i)-bb.min.y)/bh);
  ua.needsUpdate=true;
  g.rotateY(-Math.PI/2);
  return g;
}
function halvesOf(prof,seg){
  seg=seg||22;
  const a=new THREE.LatheGeometry(prof,seg,0,Math.PI);
  const b=new THREE.LatheGeometry(prof,seg,Math.PI,Math.PI);
  a.computeVertexNormals();b.computeVertexNormals();
  return [a,b];
}
function noiseOver(g,S,n,alpha){
  for(let k=0;k<n;k++){g.fillStyle='rgba(0,0,0,'+(Math.random()*alpha)+')';
    g.fillRect(Math.random()*S,Math.random()*S,2,2);}
}
function cvs(S){const c=document.createElement('canvas');c.width=c.height=S;return c;}
function texFrom(c){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;}

/* ── 粒子 ── */
const PMAX=800;
const jPos=new Float32Array(PMAX*3),jCol=new Float32Array(PMAX*3),jBase=new Float32Array(PMAX*3);
const jVel=[],jLife=new Float32Array(PMAX),jMax=new Float32Array(PMAX);
for(let i=0;i<PMAX;i++){jVel.push(new THREE.Vector3());jPos[i*3+1]=-999;}
const jGeo=new THREE.BufferGeometry();
jGeo.setAttribute('position',new THREE.BufferAttribute(jPos,3));
jGeo.setAttribute('color',new THREE.BufferAttribute(jCol,3));
const dotTex=(function(){
  const c=cvs(64),g=c.getContext('2d');
  const rg=g.createRadialGradient(32,32,0,32,32,32);
  rg.addColorStop(0,'rgba(255,255,255,1)');rg.addColorStop(.35,'rgba(255,255,255,.75)');
  rg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=rg;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);
})();
scene.add(new THREE.Points(jGeo,new THREE.PointsMaterial({size:.19,map:dotTex,vertexColors:true,
  transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true})));
let jHead=0;
function burst(pos,color,n,power,dir,spread){
  const c=new THREE.Color(color);
  for(let k=0;k<n;k++){
    const i=jHead;jHead=(jHead+1)%PMAX;
    jPos[i*3]=pos.x;jPos[i*3+1]=pos.y;jPos[i*3+2]=pos.z;
    const v=jVel[i];
    v.set((Math.random()-.5),(Math.random()-.5),(Math.random()-.5)*(spread===undefined?.7:spread))
     .normalize().multiplyScalar(power*(.35+Math.random()));
    if(dir)v.addScaledVector(dir,power*.55*Math.random());
    v.y+=power*.25;
    const f=.75+Math.random()*.6;
    jBase[i*3]=jCol[i*3]=c.r*f;jBase[i*3+1]=jCol[i*3+1]=c.g*f;jBase[i*3+2]=jCol[i*3+2]=c.b*f;
    jMax[i]=jLife[i]=.5+Math.random()*.7;
  }
  jGeo.attributes.position.needsUpdate=true;jGeo.attributes.color.needsUpdate=true;
}

/* ── 音 ── */
let AC=null,muted=false,noiseBuf=null;
function ac(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}
  if(AC.state==='suspended')AC.resume();
  if(!noiseBuf){
    noiseBuf=AC.createBuffer(1,AC.sampleRate*1.2,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  return AC;
}
function noise(dur,type,f0,f1,vol,q){
  const a=ac();if(!a||muted)return;
  const s=a.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const bp=a.createBiquadFilter();bp.type=type;bp.frequency.setValueAtTime(f0,a.currentTime);
  bp.frequency.exponentialRampToValueAtTime(Math.max(40,f1),a.currentTime+dur);
  bp.Q.value=q||1;
  const g=a.createGain();g.gain.setValueAtTime(vol,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0007,a.currentTime+dur);
  s.connect(bp);bp.connect(g);g.connect(a.destination);
  s.start();s.stop(a.currentTime+dur+.02);
}
function tone(f0,f1,dur,vol,type){
  const a=ac();if(!a||muted)return;
  const o=a.createOscillator();o.type=type||'sine';
  o.frequency.setValueAtTime(f0,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),a.currentTime+dur);
  const g=a.createGain();g.gain.setValueAtTime(vol,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0007,a.currentTime+dur);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur+.02);
}
const snd={
  swish(){noise(.13,'bandpass',2600,700,.12,1.4);},
  slice(n){noise(.16,'bandpass',5200,900,.26,1.1);tone(760+n*70,220,.16,.14,'triangle');},
  gold(){tone(880,1760,.18,.16,'triangle');tone(1320,2640,.3,.1,'sine');},
  bomb(){noise(.75,'lowpass',1500,60,.5,1);tone(150,32,.7,.35,'sawtooth');},
  miss(){tone(210,90,.26,.14,'sine');},
  combo(n){[0,1,2].forEach((k,i)=>setTimeout(()=>tone(600+n*60+k*180,900+n*60+k*180,.12,.11,'square'),i*55));},

const camUp=new THREE.Vector3(0,1,0),camRight=new THREE.Vector3(1,0,0);
const tmpV=new THREE.Vector3(),tmpU=new THREE.Vector3();
function toScreen(v){
  tmpV.copy(v).project(camera);
  return {x:(tmpV.x*.5+.5)*window.innerWidth,y:(-tmpV.y*.5+.5)*window.innerHeight};
}
function screenRadius(v,r){
  const a=toScreen(v);
  tmpU.copy(v).addScaledVector(camUp,r);
  const b=toScreen(tmpU);
  return Math.hypot(a.x-b.x,a.y-b.y);
}
function segCircle(ax,ay,bx,by,cx,cy,r){
  const dx=bx-ax,dy=by-ay,fx=ax-cx,fy=ay-cy;
  const A=dx*dx+dy*dy;
  if(A<1e-6)return (fx*fx+fy*fy)<=r*r;
  let t=-(fx*dx+fy*dy)/A;t=Math.max(0,Math.min(1,t));
  const px=ax+dx*t-cx,py=ay+dy*t-cy;
  return px*px+py*py<=r*r;
}
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,A=dx*dx+dy*dy;
  let t=A<1e-6?0:((px-ax)*dx+(py-ay)*dy)/A;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-ax-dx*t,py-ay-dy*t);
}

/* ── 2Dレイヤー描画 ── */
function drawTrail(){
  const now=performance.now()/1000;
  while(trail.length&&now-trail[0].t>TRAIL_LIFE)trail.shift();
  const N=trail.length;if(N<3)return;
  fctx.save();fctx.globalCompositeOperation='lighter';
  const passes=[[1,'rgba(90,215,255,.16)'],[.55,'rgba(190,245,255,.34)'],[.2,'rgba(255,255,255,.95)']];
  for(let k=0;k<passes.length;k++){
    const wm=passes[k][0],col=passes[k][1];
    const L=[],R=[];
    for(let i=0;i<N;i++){
      const p=trail[i],q=trail[Math.min(N-1,i+1)],r=trail[Math.max(0,i-1)];
      let dx=q.x-r.x,dy=q.y-r.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
      const age=(now-p.t)/TRAIL_LIFE;
      const tp=Math.pow(i/(N-1),.75)*(1-age*.85);
      const w=Math.max(.3,17*wm*tp);
      L.push([p.x-dy*w,p.y+dx*w]);R.push([p.x+dy*w,p.y-dx*w]);
    }
    fctx.beginPath();fctx.moveTo(L[0][0],L[0][1]);
    for(let i=1;i<L.length;i++)fctx.lineTo(L[i][0],L[i][1]);
    for(let i=R.length-1;i>=0;i--)fctx.lineTo(R[i][0],R[i][1]);
    fctx.closePath();fctx.fillStyle=col;fctx.fill();
  }
  fctx.restore();
}
const FONT=()=>getComputedStyle(document.body).fontFamily;

    const k=p.t/p.life;

  }
}

function launch(it){
  const x=(Math.random()*2-1)*ARC.halfW;
  it.pos.set(x,-ARC.visH-1.6,(Math.random()-.5)*2.6);
  const apex=ARC.visH*(.45+Math.random()*.42);
  const vy=Math.sqrt(2*G*(apex-it.pos.y));
  it.vel.set(-x*(.1+Math.random()*.2)+(Math.random()-.5)*1.2,vy,(Math.random()-.5)*.5);
  it.grp.position.copy(it.pos);
}
function spawnVeg(def,special){
  const a=asset(def),grp=new THREE.Group();
  const mA=new THREE.Mesh(a.gA,a.skinMat),mB=new THREE.Mesh(a.gB,a.skinMat);
  mA.castShadow=mB.castShadow=true;
  const fA=new THREE.Mesh(a.gF,a.fleshMat),fB=new THREE.Mesh(a.gF,a.fleshMat);
  fA.visible=fB.visible=false;
  const hA=new THREE.Group(),hB=new THREE.Group();
  hA.add(mA,fA);hB.add(mB,fB);
  const st=makeStem(a);if(st)hA.add(st);
  grp.add(hA,hB);
  grp.rotation.set(Math.random()*6.28,Math.random()*6.28,Math.random()*6.28);
  const it={kind:'veg',def,grp,hA,hB,fA,fB,pos:new THREE.Vector3(),vel:new THREE.Vector3(),
    spin:new THREE.Vector3((Math.random()-.5)*3.4,(Math.random()-.5)*3.4,(Math.random()-.5)*3.4),
    radius:Math.max(def.r,def.h*.42),special:!!special,dead:false};
  launch(it);root.add(grp);items.push(it);
}
function spawnBomb(){
  const grp=new THREE.Group();
  const b=new THREE.Mesh(bombGeo,bombMat);b.castShadow=true;grp.add(b);
  const band=new THREE.Mesh(bandGeo,bandMat);band.rotation.x=Math.PI/2;band.castShadow=true;grp.add(band);
  const f=new THREE.Mesh(fuseGeo,fuseMat);f.rotation.z=.28;grp.add(f);
  const sp=new THREE.Mesh(sparkGeo,sparkMat);sp.position.set(-.26,.94,0);grp.add(sp);
  const it={kind:'bomb',grp,spark:sp,pos:new THREE.Vector3(),vel:new THREE.Vector3(),
    spin:new THREE.Vector3((Math.random()-.5)*2,(Math.random()-.5)*2,0),radius:.72,dead:false};
  launch(it);root.add(grp);items.push(it);
}
function scheduleWave(){
  const diff=Math.min(1,elapsed/85);
  const n=1+Math.floor(Math.random()*2.4+diff*2.2);
  for(let i=0;i<n;i++){
    pending.push({t:elapsed+i*(.09+Math.random()*.16),fn:function(){
      const bombP=elapsed<9?0:.06+diff*.15;
      if(Math.random()<bombP)spawnBomb();
      else if(Math.random()<.035)spawnVeg(GOLD,true);
      else spawnVeg(TYPES[(Math.random()*TYPES.length)|0]);
    }});
  }
  nextWave=elapsed+Math.max(.62,1.65-diff*.85)+Math.random()*.3;
}
function cutVeg(it,dir,sc){
  it.dead=true;
  const n=new THREE.Vector3().addScaledVector(camRight,-dir.y).addScaledVector(camUp,-dir.x).normalize();
  const cur=new THREE.Vector3(0,1,0).applyQuaternion(it.grp.quaternion);
  let up=cur.clone().addScaledVector(n,-cur.dot(n));
  if(up.lengthSq()<1e-4)up.set(0,0,1).addScaledVector(n,-n.z);
  up.normalize();
  const f=new THREE.Vector3().crossVectors(n,up).normalize();
  const q=new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(n,up,f));
  it.fA.visible=it.fB.visible=true;
  const sep=1.9+Math.random()*1.1;
  [[it.hA,1],[it.hB,-1]].forEach(function(e){
    const h=e[0],s=e[1];
    root.add(h);h.quaternion.copy(q);
    h.position.copy(it.pos).addScaledVector(n,s*.045);
    halves.push({o:h,vel:it.vel.clone().multiplyScalar(.62).addScaledVector(n,s*sep).add(new THREE.Vector3(0,1.2,0)),
      spin:new THREE.Vector3((Math.random()-.5)*7,(Math.random()-.5)*5,(Math.random()-.5)*7),life:3.4});
  });
  root.remove(it.grp);
  const wd=new THREE.Vector3().addScaledVector(camRight,dir.x).addScaledVector(camUp,-dir.y);
  burst(it.pos,it.def.flesh,it.special?34:22,4.2,wd);
  addSplat(sc.x,sc.y,it.def.flesh,dir,it.special);
  if(it.special){snd.gold();addScore(GOLD.score);slowmo(.32,1.1);dolly=1.8;
    popup(it.pos,'+'+GOLD.score,'#ffc63d',34);}
  else{snd.slice(comboWin.length);addScore(it.def.score);popup(it.pos,'+'+it.def.score,'#eaffd0',24);}
  sliced++;shakeAdd(.18);
}
function explode(it){
  it.dead=true;snd.bomb();
  burst(it.pos,0xffb04a,60,7.5);burst(it.pos,0xff3b1e,40,5.5);
  root.remove(it.grp);shakeAdd(1.5);whiteFlash(.92);
  if(state==='play')gameOver('ドカーン！','斬った野菜 '+sliced+'　最大 '+(maxCombo||1)+'れんぎり');
}
function slash(a,b){
  const len=Math.hypot(b.x-a.x,b.y-a.y);
  if(len<9)return;
  let hits=0;
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];if(it.dead)continue;
    const sc=toScreen(it.pos),r=screenRadius(it.pos,it.radius)*.92;
    if(!segCircle(a.x,a.y,b.x,b.y,sc.x,sc.y,r))continue;
    if(it.kind==='bomb'){explode(it);return;}
    cutVeg(it,{x:(b.x-a.x)/len,y:(b.y-a.y)/len},sc);hits++;
  }
  if(hits>0&&state==='play'){
    comboWin.push(elapsed);
    comboWin=comboWin.filter(t=>elapsed-t<.55);
    if(comboWin.length>=3){
      const n=comboWin.length;maxCombo=Math.max(maxCombo,n);
      addScore(n*12);snd.combo(n);
      banner(n+'れんぎり！ +'+(n*12),'#ffc63d');
      slowmo(.34,.75);dolly=1.4;
    }
  }
}
function demoTick(dt){
  if(demoSwipe){
    demoSwipe.t+=dt*4.2;
    const t=Math.min(1,demoSwipe.t);
    const p={x:demoSwipe.a.x+(demoSwipe.b.x-demoSwipe.a.x)*t,y:demoSwipe.a.y+(demoSwipe.b.y-demoSwipe.a.y)*t};
    pushTrail(p);
    if(demoSwipe.last)slash(demoSwipe.last,p);
    demoSwipe.last=p;
    if(t>=1)demoSwipe=null;
    return;
  }
  if(elapsed<demoNext)return;
  const cand=items.filter(i=>!i.dead&&i.kind==='veg'&&i.vel.y<3.2);
  if(!cand.length)return;
  const s=toScreen(cand[(Math.random()*cand.length)|0].pos);
  const ang=Math.random()*Math.PI*2,L=190;
  demoSwipe={a:{x:s.x-Math.cos(ang)*L*.5,y:s.y-Math.sin(ang)*L*.5},
             b:{x:s.x+Math.cos(ang)*L*.6,y:s.y+Math.sin(ang)*L*.6},t:0,last:null};
  trail.length=0;demoNext=elapsed+.55+Math.random()*.5;snd.swish();
}
function clear(){
  items.forEach(it=>root.remove(it.grp));items.length=0;
  halves.forEach(h=>root.remove(h.o));halves.length=0;
  pending.length=0;comboWin=[];
}

MODES.yasai={
  id:'yasai',label:'やさい斬り',root:root,
  theme:{id:'yasai',back:0x14231f,glow:0x2f6b4e,fog:0x08110e,under:0x8fe044,rim:0x6ee0ff},
  uses:{lives:true},
  howto:'<p>飛んでくる野菜を指でスワイプして斬る。</p><p>3つ以上まとめて斬ると<b>れんぎり</b>ボーナス。きんのトマトは特大点。</p><p>爆弾を斬ったら即おしまい。野菜を3つ落としてもおしまい。</p>',
  enter(isDemo){
    demo=isDemo;clear();
    scene.fog.near=20;scene.fog.far=52;renderer.shadowMap.enabled=true;
    back.visible=true;glow.visible=true;dust.visible=true;
    nextWave=isDemo?.6:.4;demoNext=1.1;demoSwipe=null;sliced=0;maxCombo=0;dolly=1.2;
    if(!isDemo)hint('スワイプして斬る');
  },
  exit(){clear();},
  onMove(a,b){if(state==='play'||state==='demo')slash(a,b);},
  update(dt,raw){
    if(state==='play'||state==='demo'){
      if(elapsed>nextWave)scheduleWave();
      for(let i=pending.length-1;i>=0;i--)if(elapsed>=pending[i].t){pending[i].fn();pending.splice(i,1);}
      if(demo)demoTick(dt);
    }
    for(let i=items.length-1;i>=0;i--){
      const it=items[i];
      if(it.dead){items.splice(i,1);continue;}
      it.vel.y-=G*dt;
      it.pos.addScaledVector(it.vel,dt);
      it.grp.position.copy(it.pos);
      it.grp.rotation.x+=it.spin.x*dt;it.grp.rotation.y+=it.spin.y*dt;it.grp.rotation.z+=it.spin.z*dt;
      if(it.spark){
        it.spark.scale.setScalar(1+Math.sin(elapsed*36)*.35);
        if(Math.random()<dt*24)burst(it.pos.clone().add(new THREE.Vector3(-.26,.94,0)),0xffc45c,1,1.2);
      }
      if(it.pos.y<-ARC.visH-2.6){
        root.remove(it.grp);items.splice(i,1);
        if(it.kind==='veg'&&state==='play')loseLife();
      }
    }
    for(let i=halves.length-1;i>=0;i--){
      const h=halves[i];h.vel.y-=G*dt;
      h.o.position.addScaledVector(h.vel,dt);
      h.o.rotation.x+=h.spin.x*dt;h.o.rotation.y+=h.spin.y*dt;h.o.rotation.z+=h.spin.z*dt;
      h.life-=dt;
      if(h.o.position.y<-ARC.visH-3||h.life<0){root.remove(h.o);halves.splice(i,1);}
    }
    // カメラ：ゆるやかなドリフト＋野菜の重心追従
    const t=elapsed;
    camWant.set(Math.sin(t*.21)*1.7+Math.sin(t*.53)*.35,.6+Math.sin(t*.29)*.6,
      ARC.z+Math.sin(t*.17)*.9-dolly*2.2);
    let cx=0,cy=.4,cn=0;
    for(const it of items)if(!it.dead&&it.pos.y>-ARC.visH){cx+=it.pos.x;cy+=it.pos.y;cn++;}
    if(cn){cx/=cn;cy/=cn;}else{cx=0;cy=.4;}
    lookWant.set(cx*.34,.3+cy*.2,0);
    fovWant=46-dolly*1.6;
    dolly*=Math.exp(-2.2*raw);
    camLag=1.9;
  },
  overStats(){return '斬った野菜 '+sliced+'　最大 '+(maxCombo||1)+'れんぎり';}
};
})();

const ballTex=(function(){
  const S=128,c=cvs(S),g=c.getContext('2d');
  g.fillStyle='#fbfbf6';g.fillRect(0,0,S,S);
  g.strokeStyle='#d4342a';g.lineWidth=3;
  for(const off of [S*.3,S*.7]){
    g.beginPath();
    for(let x=0;x<=S;x+=6)g.lineTo(x,off+Math.sin(x/S*Math.PI*2)*13);
    g.stroke();
    for(let x=4;x<S;x+=11){
      const y=off+Math.sin(x/S*Math.PI*2)*13;
      g.beginPath();g.moveTo(x-3,y-5);g.lineTo(x+3,y-1);g.stroke();
      g.beginPath();g.moveTo(x-3,y+5);g.lineTo(x+3,y+1);g.stroke();
    }
  }
  return texFrom(c);
})();

/* ── 進行 ── */
const PITCHES=14;
let bvel=new THREE.Vector3(),phase='wait',pt2=0,pitchLeft=PITCHES;
let swingT=-1,contactAt=.075,hits=0,hrs=0,farthest=0,dist=0,camMode='bat';
let resultT=0,swungAt=-1,pitchVz=15,pitcherDown=false,streak=0,hrStreak=0,bestStreak=0;

function resetBall(){trailPts.length=0;trailLine.visible=false;bshadow.visible=false;ball.visible=false;}
function nextPitch(){
  pitcherDown=false;
  if(pitchLeft<=0){gameOver('しあいしゅうりょう');return;}
  resetBall();
  parm.rotation.x=0;parm2.rotation.x=0;pitcher.rotation.y=0;pitcher.position.z=MOUND_Z;
  phase='ready';pt2=elapsed+1.5;camMode='bat';
  setStep('のこり '+pitchLeft+'球');drawBoard();
}
function throwBall(){
  const diff=1-pitchLeft/PITCHES;
  const sp=13+Math.random()*2+diff*3.4;
  const from=new THREE.Vector3(.1,1.95,MOUND_Z+1.15);
  const to=new THREE.Vector3(-.02+(Math.random()-.5)*.34,1.0+Math.random()*.45,PLATE_Z);
  const d=from.distanceTo(to),T=d/sp;
  bvel.copy(to).sub(from).divideScalar(T);
  bvel.y+=.5*PITCH_G*T;
  ball.position.copy(from);ball.visible=true;
  pitchVz=Math.abs(bvel.z);
  phase='pitch';swungAt=-1;
  noise(.1,'bandpass',1100,400,.14,1);
}
function doSwing(){
  if(swingT>=0)return;
  swingT=0;swungAt=-1;
  noise(.12,'bandpass',1700,500,.11,1.2);
}
function contact(){
  if(phase!=='pitch')return;
  const dz=ball.position.z-PLATE_Z;
  if(Math.abs(dz)>WIN||ball.position.z>2.8){
    streak=0;
    if(ball.position.z<PLATE_Z)popup(new THREE.Vector3(.6,1.6,PLATE_Z),'はやい','#9fc0ff',22);
    else popup(new THREE.Vector3(.6,1.6,PLATE_Z),'おそい','#ffb27a',22);
    return;
  }
  const q=Math.max(0,1-Math.abs(dz)/WIN);
  const k=Math.pow(q,.7);
  const ang=THREE.MathUtils.degToRad(29+k*5+(Math.random()-.5)*2.5);
  const spray=THREE.MathUtils.degToRad(THREE.MathUtils.clamp(-dz*19,-34,34));
  const sp=25.5+21*k;
  bvel.set(Math.sin(spray)*Math.cos(ang),Math.sin(ang),-Math.cos(spray)*Math.cos(ang)).multiplyScalar(sp);
  phase='fly';camMode='fly';hits++;
  trailPts.length=0;trailLine.visible=true;
  burst(ball.position,0xffffff,20,4.4);
  shakeAdd(.45+k*.55);
  const label=k>.72?'ジャストミート！':(k>.45?'ナイスバッティング':'当たった！');
  snd.chop();tone(320+k*520,120,.2,.24,'triangle');
  slowmo(.22,.1);
  if(k>.72){snd.good(2);whiteFlash(.2);}
  banner(label,k>.72?'#ffe27a':'#eaffd0');
}
function endBall(text,color,pts){
  if(phase==='done')return;
  phase='done';resultT=elapsed+1.5;
  if(pts)addScore(pts);
  banner(text,color);drawBoard();
}
function clear(){
  resetBall();phase='wait';pitchLeft=PITCHES;swingT=-1;
  hits=0;hrs=0;farthest=0;dist=0;camMode='bat';
  pitcherDown=false;pitcher.rotation.set(0,0,0);pitcher.position.set(0,.24,MOUND_Z);
  streak=0;hrStreak=0;bestStreak=0;
  parm.rotation.set(0,0,0);parm2.rotation.set(0,0,0);
  targets.forEach(function(t){t.alive=true;t.mesh.visible=true;t.mesh.scale.set(1,1,1);});
  swing.rotation.set(0,0,0);batter.rotation.y=Math.PI*.06;
}

MODES.homerun={
  id:'homerun',label:'スッキリ！ホームラン',root:root,
  theme:{id:'homerun',back:0x0d1a22,glow:0x1f4d5e,fog:0x08131a,under:0x6fd0ff,rim:0xa8e6ff},
  uses:{lives:false},swish:false,
  howto:'<p>投手が投げた球を<b>タップして打つ</b>。振り始めてから当たるまで少し間があるので、球がベースに来る少し前がねらい目。</p><p>芯で捉えるほど打球が速く、遠くまで飛ぶ。打ち上げ角は自動なので<b>タイミングだけ</b>に集中。</p><p>フェンス越えでホームラン。ジャストミートなら<b>場外ホームラン</b>も。看板・的・投手への直撃で大加点。14球勝負。</p>',
  enter(){
    clear();
    scene.fog.near=70;scene.fog.far=260;
    back.visible=false;glow.visible=false;dust.visible=false;
    nextPitch();drawBoard();
    hint('球がベースに来る少し前にタップ',3.4);
  },
  exit(){clear();back.visible=true;glow.visible=true;dust.visible=true;},
  onDown(){
    if(state!=='play')return;
    doSwing();
  },
  update(dt,raw){
    /* 投球モーション */
    if(phase==='ready'){
      const u=THREE.MathUtils.clamp(1-(pt2-elapsed)/1.5,0,1);
      /* 0-.28 ためる（腕を前下へ）/ .28-.72 大きく振り上げ / .72-1 振り下ろし */
      let a;
      if(u<.28){a=.75*(u/.28);}
      else if(u<.72){const r=(u-.28)/.44;a=.75-3.65*(1-Math.cos(r*Math.PI))/2;}
      else{const r=(u-.72)/.28;a=-2.9+3.75*Math.pow(r,1.8);}
      parm.rotation.x=a;
      parm2.rotation.x=(u<.72?1.2*Math.sin(Math.min(1,u/.72)*Math.PI*.5):1.2*(1-(u-.72)/.28));
      pitcher.rotation.y=.4*Math.sin(Math.min(1,u/.72)*Math.PI*.5)*(u<.72?1:Math.max(0,1-(u-.72)/.28));
      pitcher.position.z=MOUND_Z+(u>.55?(u-.55)*1.1:0);
      if(elapsed>pt2)throwBall();
    }else if(!pitcherDown&&phase!=='fly'){
      parm.rotation.x+=(0-parm.rotation.x)*(1-Math.exp(-5*raw));
      parm2.rotation.x+=(0-parm2.rotation.x)*(1-Math.exp(-5*raw));
    }
    /* ボール */
    if(phase==='pitch'||phase==='fly'){
      bvel.y-=(phase==='fly'?HIT_G:PITCH_G)*dt;
      ball.position.addScaledVector(bvel,dt);
      ball.rotation.x+=dt*14;ball.rotation.y+=dt*9;
      bshadow.visible=true;
      bshadow.position.set(ball.position.x,.08,ball.position.z);
      const hgt=Math.max(0,ball.position.y);
      bshadow.scale.setScalar(1+hgt*.14);
      bshadow.material.opacity=Math.max(.05,.34-hgt*.016);
      if(phase==='fly'){
        trailPts.push(ball.position.clone());
        if(trailPts.length>160)trailPts.shift();
        const arr=trailGeo.attributes.position.array;
        for(let i=0;i<trailPts.length;i++){arr[i*3]=trailPts[i].x;arr[i*3+1]=trailPts[i].y;arr[i*3+2]=trailPts[i].z;}
        trailGeo.setDrawRange(0,trailPts.length);
        trailGeo.attributes.position.needsUpdate=true;
        if(Math.random()<dt*26)burst(ball.position,0xfff0c0,1,.6);
      }
      if(phase==='pitch'&&ball.position.z>3.6){
        pitchLeft--;streak=0;hrStreak=0;
        endBall(swungAt>0?'空ぶり…':'見のがし','#ff9d7a',0);
        snd.miss();shakeAdd(.2);
      }
      if(phase==='fly'){
        const bx=ball.position.x,by=ball.position.y,bz=ball.position.z;
        const R=Math.hypot(bx,bz);
        const phi=Math.atan2(bx,-bz);
        /* 投手直撃 */
        if(!pitcherDown&&Math.abs(bz-MOUND_Z)<1.3&&Math.abs(bx)<1.2&&by<2.4){
          pitcherDown=true;addScore(250);
          burst(new THREE.Vector3(0,1.4,MOUND_Z),0xffd9cf,40,6);
          snd.bomb();shakeAdd(1.2);
          banner('ピッチャー直撃！ +250','#6fd0ff');
          popup(new THREE.Vector3(0,3,MOUND_Z),'ざまあ！','#6fd0ff',30);
        }
        if(Math.abs(phi)>46*D2R&&R>12){
          pitchLeft--;streak=0;
          endBall('ファウル','#ff9d7a',0);
        }else if(R>FENCE_R&&by>FENCE_H){
          pitchLeft--;hrs++;streak++;hrStreak++;bestStreak=Math.max(bestStreak,streak);
          (function(){
            const vy=bvel.y,tf=(vy+Math.sqrt(Math.max(0,vy*vy+2*HIT_G*by)))/HIT_G;
            const lx=bx+bvel.x*tf,lz=bz+bvel.z*tf;
            dist=Math.round(Math.hypot(lx,lz));
          })();
          farthest=Math.max(farthest,dist);
          let pts=dist*2+150,msg='ホームラン！';
          if(Math.abs(phi)<7.2*D2R&&by>FENCE_H+1&&by<FENCE_H+7){pts+=350;msg='看板直撃！！';}
          if(dist>=88){pts+=500;msg='場外ホームラン！！';}
          if(hrStreak>1){pts+=hrStreak*60;msg=hrStreak+'打席連続！ '+msg;}
          burst(ball.position,0xffe27a,50,6);
          whiteFlash(.34);shakeAdd(1.3);snd.gold();snd.combo(4);snd.cheer();
          const fw=dist>=88?6:3;
          for(let f=0;f<fw;f++)setTimeout(function(){
            burst(new THREE.Vector3((Math.random()-.5)*54,15+Math.random()*8,-(FENCE_R+6)),
              [0xffe27a,0x8fe044,0x6fd0ff][f%3],46,10,null,1.4);
            noise(.5,'bandpass',2400,600,.14,1.2);
          },260*f+140);
          endBall(msg+' +'+pts,'#ffe27a',pts);
          popup(ball.position,dist+'m','#ffe27a',36);
        }else if(R>FENCE_R-.3&&by<=FENCE_H+.1){
          /* フェンス直撃（的あり） */
          pitchLeft--;streak++;hrStreak=0;bestStreak=Math.max(bestStreak,streak);
          dist=Math.round(FENCE_R);farthest=Math.max(farthest,dist);
          let pts=90,msg='フェンス直撃！';
          for(const tg of targets){
            if(tg.alive&&Math.abs(phi-tg.phi)<.075&&by>.4&&by<3.6){
              tg.alive=false;tg.mesh.visible=false;tg.back=elapsed+5;
              pts+=tg.pts;msg='まと直撃！！';
              burst(tg.mesh.position.clone(),new THREE.Color(tg.col).getHex(),56,7,null,1.3);
              shakeAdd(1.0);snd.bomb();whiteFlash(.2);
            }
          }
          burst(ball.position,0xcfe0d0,26,3.4);
          snd.chop();
          endBall(msg+' +'+pts,msg==='まと直撃！！'?'#ffe27a':'#eaffd0',pts);
          popup(ball.position,dist+'m','#ffffff',26);
        }else if(by<=.12){
          pitchLeft--;streak++;hrStreak=0;bestStreak=Math.max(bestStreak,streak);
          dist=Math.round(R);farthest=Math.max(farthest,dist);
          let pts=Math.round(dist*1.8);
          if(streak>=3)pts+=streak*15;
          const wall=R>FENCE_R-3.5;
          burst(ball.position,wall?0x8fbf6a:0xb08a5a,22,2.8);
          snd.plop();
          endBall(dist+'m'+(wall?'　おしい！':'')+(streak>=3?'　'+streak+'連続':'')+'　+'+pts,'#eaffd0',pts);
          popup(ball.position,dist+'m','#ffffff',26);
        }else if(R>FENCE_R+26){
          pitchLeft--;
          endBall('場外！','#ffe27a',400);
        }
      }
    }
    /* スイング判定（ボール移動後） */
    if(swingT>=0){
      swingT+=raw;
      const sk=Math.min(1,swingT/.3);
      swing.rotation.y=-1.9+3.6*(1-Math.pow(1-sk,2.2));
      batter.rotation.y=Math.PI*.06+.5*(1-Math.pow(1-sk,2.2));
      if(swungAt<0&&swingT>=contactAt){swungAt=elapsed;contact();}
      if(sk>=1){swingT=-1;swing.rotation.y=0;batter.rotation.y=Math.PI*.06;}
    }
    /* 投手ダウン */
    if(pitcherDown){
      pitcher.rotation.x+=(-1.4-pitcher.rotation.x)*(1-Math.exp(-8*raw));
      pitcher.position.z+=(MOUND_Z-1.6-pitcher.position.z)*(1-Math.exp(-8*raw));
    }else if(pitcher.rotation.x!==0){
      pitcher.rotation.x*=Math.exp(-4*raw);
      pitcher.position.z=MOUND_Z+(pitcher.position.z-MOUND_Z)*Math.exp(-4*raw);
      if(Math.abs(pitcher.rotation.x)<.01){pitcher.rotation.x=0;pitcher.position.z=MOUND_Z;}
    }
    /* 的の復活 */
    for(const tg of targets){
      if(!tg.alive&&elapsed>tg.back){tg.alive=true;tg.mesh.visible=true;tg.mesh.scale.set(.2,.2,1);}
      if(tg.alive&&tg.mesh.scale.x<1)tg.mesh.scale.x=tg.mesh.scale.y=Math.min(1,tg.mesh.scale.x+raw*4.5);
    }
    if(phase==='done'&&elapsed>resultT){camMode='bat';nextPitch();}
    /* カメラ */
    const t=elapsed;
    if(camMode==='fly'){
      const v=bvel.clone().normalize();
      camWant.copy(ball.position).addScaledVector(v,-12.5).add(new THREE.Vector3(0,4.6,0));
      camWant.y=Math.max(2.2,camWant.y);
      lookWant.copy(ball.position);
      fovWant=56;camLag=4.6;
    }else{
      const close=(phase==='pitch')?1:0;
      camWant.set(.1+Math.sin(t*.23)*.09,3.5+Math.sin(t*.31)*.06,7.2-close*.3+Math.sin(t*.18)*.12);
      lookWant.set(0,1.55-close*.08,-14+close*1.4);
      fovWant=46;camLag=2.6;
    }
  },
  overStats(){return 'ホームラン '+hrs+'本　ヒット '+hits+'　最長 '+farthest+'m　最高 '+bestStreak+'連続';}
};
})();

/* ══════════════════════════════════════════

(function(){

  const g=c.getContext('2d');
  g.fillStyle='#22252b';g.fillRect(0,0,W,H);

  g.strokeStyle='#f0c02e';g.lineWidth=14;
  for(let i=-S;i<S*2;i+=30){g.beginPath();g.moveTo(i,0);g.lineTo(i+S,S);g.stroke();}

    const m=new THREE.Mesh(new THREE.PlaneGeometry(2.4,420),
      new THREE.MeshStandardMaterial({map:t,roughness:.9}));

/* 車 */
function makeCar(color,player){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.72,.5,4.2),
    new THREE.MeshPhysicalMaterial({color:color,roughness:.28,metalness:.5,clearcoat:1}));
  body.position.y=.62;body.castShadow=true;g.add(body);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(1.46,.48,2.0),
    new THREE.MeshPhysicalMaterial({color:color,roughness:.28,metalness:.5,clearcoat:1}));
  roof.position.set(0,1.08,.1);roof.castShadow=true;g.add(roof);
  if(player){
    const glass=new THREE.Mesh(new THREE.BoxGeometry(1.5,.4,2.04),
      new THREE.MeshPhysicalMaterial({color:0x0d1620,roughness:.08,metalness:.3,clearcoat:1}));
    glass.position.set(0,1.1,.1);g.add(glass);
  }
  const wm=new THREE.MeshStandardMaterial({color:0x14171b,roughness:.9});
  for(const sx of [-1,1])for(const sz of [-1,1]){
    const w=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.28,14),wm);
    w.rotation.z=Math.PI/2;w.position.set(sx*.86,.34,sz*1.38);g.add(w);
  }
  const tl=new THREE.MeshBasicMaterial({color:player?0xff3b2e:0xff2a1a});
  for(const sx of [-1,1]){
    const t=new THREE.Mesh(new THREE.BoxGeometry(.5,.16,.1),tl);
    t.position.set(sx*.54,.7,2.12);g.add(t);
  }
  const hl=new THREE.MeshBasicMaterial({color:0xfff4d0});
  for(const sx of [-1,1]){
    const t=new THREE.Mesh(new THREE.BoxGeometry(.46,.16,.1),hl);
    t.position.set(sx*.58,.68,-2.12);g.add(t);
  }
  if(player){
    const sp=new THREE.Mesh(new THREE.BoxGeometry(1.76,.1,.46),
      new THREE.MeshStandardMaterial({color:0x16181c,roughness:.4}));
    sp.position.set(0,1.14,2.02);g.add(sp);
    for(const sx of [-1,1]){
      const st=new THREE.Mesh(new THREE.BoxGeometry(.12,.34,.12),
        new THREE.MeshStandardMaterial({color:0x16181c}));
      st.position.set(sx*.7,.98,2.02);g.add(st);
    }
  }
  return g;
}

const COLORS=[0x2f7fd4,0xf0c419,0xe8ecef,0x2b3138,0x53b36b,0xd98026,0x7a52c9,0xcfd6dc];
const traffic=[];
for(let i=0;i<16;i++){
  const c=makeCar(COLORS[i%COLORS.length],false);
  c.visible=false;traffic.push({o:c,lane:0,sp:0,z:0,active:false,passed:false});root.add(c);
}
/* 効果 */
const laneMark=new THREE.Mesh(new THREE.PlaneGeometry(2.1,34),
  new THREE.MeshBasicMaterial({color:0x6fd0ff,transparent:true,opacity:.13,
    blending:THREE.AdditiveBlending,depthWrite:false}));
laneMark.rotation.x=-Math.PI/2;laneMark.position.set(0,.05,-13);root.add(laneMark);
const boostRing=new THREE.Mesh(new THREE.TorusGeometry(2.2,.12,8,28),

let dragX=0,dragged=0,laneIdx=2,corridor=2,rowsSpawned=0,sinceRow=0;
let speed=40,px=LANES[2],timeLeft=60,passes=0,near=0,crashes=0,spin=0,drafting=0,invul=0,uiT=0;
let cleanT=0,cleanMark=0,topSpeed=0;
const _tmp=new THREE.Vector3();
const laneScreen=[0,0,0,0];
const _pv=new THREE.Vector3();
function updateLaneScreen(){
  const W=window.innerWidth;
  for(let i=0;i<LANES.length;i++){
    _pv.set(LANES[i],.4,-3).project(camera);
    laneScreen[i]=(_pv.x*.5+.5)*W;
  }
}
function setLaneFromX(x){
  if(state!=='play')return;
  let best=0,bd=1e9;
  for(let i=0;i<LANES.length;i++){
    const d=Math.abs(x-laneScreen[i]);
    if(d<bd){bd=d;best=i;}
  }
  if(best===laneIdx)return;
  /* ヒステリシス：今の車線から十分離れないと変えない */
  const gap=Math.abs(laneScreen[1]-laneScreen[0])||40;
  if(Math.abs(x-laneScreen[laneIdx])<gap*.62)return;
  laneIdx=best;
  noise(.09,'bandpass',1500,700,.09,1.4);
}
function freeCar(){
  for(const c of traffic)if(!c.active)return c;
  return null;
}
function spawnRow(z){
  const diff=Math.min(1,(60-timeLeft)/45);
  /* 抜け道は最大2車線ぶんまで動く（必ず通り道は続く） */
  if(rowsSpawned>0){
    const r=Math.random();
    const d=r<.15?0:(r<.65?1:2);
    if(d)corridor=Math.max(0,Math.min(LANES.length-1,corridor+(Math.random()<.5?-d:d)));
  }
  rowsSpawned++;
  const sp=27+Math.random()*5;
  /* 抜け道以外の5車線から2〜4台。必ず2車線以上は空く */
  const pool=[];
  for(let i=0;i<LANES.length;i++)if(i!==corridor)pool.push(i);
  for(let i=pool.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=pool[i];pool[i]=pool[j];pool[j]=t;}
  const n=Math.min(3,1+Math.floor(diff*1.5+Math.random()*1.8));
  for(let k=0;k<n;k++){
    const c=freeCar();if(!c)break;
    const i=pool[k];
    c.active=true;c.passed=false;c.lane=LANES[i];c.laneIdx=i;
    c.sp=sp+(Math.random()-.5)*1.2;
    c.z=z+(Math.random()-.5)*17;   /* 前後にばらけさせて横一直線を避ける */
    c.o.visible=true;c.o.position.set(c.lane,0,c.z);c.o.rotation.y=0;
  }
  return n;
}
function clear(){
  traffic.forEach(c=>{c.active=false;c.o.visible=false;});
  speed=40;passes=0;near=0;crashes=0;spin=0;drafting=0;invul=0;
  laneIdx=2;corridor=2;rowsSpawned=0;sinceRow=0;dragged=0;cleanT=0;cleanMark=0;topSpeed=0;
  px=LANES[laneIdx];
  player.position.set(px,0,0);player.rotation.set(0,0,0);
  boostRing.visible=false;
}

MODES.racing={
  id:'racing',label:'スッキリ！ぶち抜きレース',root:root,
  theme:{id:'racing',back:0x0a0c14,glow:0x241a4a,fog:0x070810,under:0x6f7cff,rim:0x9fb4ff},
  uses:{lives:false,timer:true},swish:false,
  howto:'<p>走るのは内側4車線。画面下のボタン（＝各車線の真下）を<b>タップ</b>するとその車線へ移動。なぞってもOK。</p><p>前の車のすぐ後ろにつくと<b>スリップストリーム</b>で加速。</p><p>ぶつからずに走り続けるほど最高速がどんどん上がる。ぶつかると大減速＋加速リセット。60秒でどれだけぶち抜けるか。</p>',
  enter(){
    clear();timeLeft=60;
    scene.fog.near=55;scene.fog.far=235;
    back.visible=false;glow.visible=false;dust.visible=false;
    renderer.shadowMap.enabled=false;
    for(let i=0;i<3;i++)spawnRow(-46-i*70);
    timerBar.style.width='100%';timerBar.classList.remove('low');
    hint('行きたい車線のボタンをタップ',3.2);
  },
  exit(){clear();back.visible=true;glow.visible=true;dust.visible=true;renderer.shadowMap.enabled=true;},
  onDown(p){setLaneFromX(p.x);},
  onMove(a,b){setLaneFromX(b.x);},
  update(dt,raw){
    if(state==='play'){
      timeLeft-=raw;
      timerBar.style.width=Math.max(0,timeLeft/60*100)+'%';
      if(timeLeft<10){timerBar.classList.add('low');
        if(Math.floor(timeLeft)!==Math.floor(timeLeft+raw))snd.tick();}
      if(timeLeft<=0){timeLeft=0;gameOver('チェッカー！');}
    }
    /* 速度：ぶつからずに走り続けるほど伸びる */
    if(state==='play')cleanT+=raw;
    const boost=Math.min(54,cleanT*1.8);
    const maxS=(drafting>0?94:82)+boost;
    const acc=(drafting>0?30:16)*(1-speed/maxS);
    speed=Math.max(16,Math.min(maxS,speed+acc*dt));
    topSpeed=Math.max(topSpeed,speed);
    invul=Math.max(0,invul-raw);
    if(state==='play'&&cleanT>cleanMark+10){
      cleanMark=Math.floor(cleanT/10)*10;
      banner('ノーミス '+cleanMark+'秒！ さらに加速','#6fd0ff');
      snd.combo(3);addScore(cleanMark*10);
    }
    /* 車線移動（1車線ずつ、なめらかに寄せる） */
    const tgt=LANES[laneIdx];
    const want=tgt-px;
    const maxLat=15.5*raw;
    px+=Math.abs(want)<=maxLat?want:Math.sign(want)*maxLat;
    player.position.x=px;
    laneMark.position.x=LANES[laneIdx];
    laneMark.material.opacity=.10+Math.abs(Math.sin(elapsed*2.5))*.05;
    player.rotation.y=THREE.MathUtils.clamp(want*.16,-.34,.34)+spin;
    player.rotation.z=THREE.MathUtils.clamp(want*-.075,-.2,.2);
    if(spin!==0)spin*=Math.exp(-3.4*raw);
    player.position.y=Math.abs(Math.sin(elapsed*22))*.012;
    /* 路面スクロール */
    roadTex.offset.y-=speed*dt*.0355;
    for(const g of lamps){
      g.position.z+=speed*dt;
      if(g.position.z>BEHIND)g.position.z-=16*26;
    }
    for(const p of poles){
      p.position.z+=speed*dt;
      if(p.position.z>BEHIND)p.position.z-=18*24;
    }
    for(const b of bldgs){
      b.position.z+=speed*dt*.96;
      if(b.position.z>BEHIND+20){b.position.z-=18*24;
        b.position.x=(Math.random()<.5?-1:1)*(20+Math.random()*34);}
    }
    /* 交通 */
    drafting=Math.max(0,drafting-raw);
    /* 相対距離で次の車列を送り出す */
    if(state==='play'){
      sinceRow+=Math.max(0,speed-29)*dt;
      const dfc=Math.min(1,(60-timeLeft)/40);
      if(sinceRow>(78-dfc*18)+Math.random()*16){sinceRow=0;spawnRow(FAR);}
    }
    let ahead=null;
    for(const c of traffic){
      if(!c.active)continue;
      c.z+=(speed-c.sp)*dt;
      c.o.position.z=c.z;
      const dx=c.lane-px, dz=c.z;
      if(Math.abs(dz)<2.9&&Math.abs(dx)<1.55&&invul<=0&&state==='play'){
        speed=Math.max(15,speed*.4);
        crashes++;invul=1.0;spin=(dx>0?-1:1)*.55;cleanT=0;cleanMark=0;
        shakeAdd(1.7);snd.bomb();whiteFlash(.2);
        burst(_tmp.set(px,1,dz-1),0xffb04a,34,5.5);
        popup(_tmp.set(px,1.8,dz-1),'ドン！','#ff9d7a',28);
        c.z-=7;c.o.position.z=c.z;
      }
      if(!c.passed&&dz>2.6){
        c.passed=true;passes++;
        addScore(10);
      }
      if(dz>BEHIND+8){c.active=false;c.o.visible=false;}
      if(dz<-3&&dz>-17&&Math.abs(dx)<1.5){ahead=c;}
    }
    if(ahead&&invul<=0){
      drafting=.25;
      boostRing.visible=true;
      boostRing.position.set(px,1,-3.2);
      boostRing.scale.setScalar(.8+Math.sin(elapsed*16)*.12);
      boostRing.material.opacity=.35+Math.sin(elapsed*16)*.2;
      if(Math.random()<dt*40)burst(_tmp.set(px+(Math.random()-.5)*2,.6,2.4),0x6fd0ff,1,1.6);
    }else boostRing.visible=false;
    /* カメラ */
    const sp01=Math.min(1.25,(speed-40)/62);
    camWant.set(px*.5+Math.sin(elapsed*.7)*.06,2.7+sp01*.25,8.4-sp01*.9);
    lookWant.set(px*.72,1.15,-15);
    fovWant=54+sp01*26;
    camLag=5.5;
    if(speed>78)shakeAdd(raw*.8);
    /* HUD */
    updateLaneScreen();
    uiT+=raw;
    if(uiT>.1){uiT=0;setStep(Math.round(speed*3.6)+' km/h　'+passes+'台'+(boost>4?'　🔥':''));}
  },
  draw2d(){
    if(state==='play'){
      const W=window.innerWidth,H=window.innerHeight;
      const y=H-Math.max(66,H*.095),h=14;
      const gap=Math.abs(laneScreen[1]-laneScreen[0])||W/4;
      fctx.save();
      const bnd=[0];
      for(let i=1;i<LANES.length;i++)bnd.push((laneScreen[i-1]+laneScreen[i])/2);
      bnd.push(W);
      for(let i=0;i<LANES.length;i++){
        const x0=bnd[i]+3,x1=bnd[i+1]-3;
        if(i===laneIdx){
          fctx.fillStyle='rgba(111,208,255,.9)';
          fctx.fillRect(x0,y-5,x1-x0,h+10);
          fctx.fillStyle='#06121c';
          fctx.beginPath();
          const cx=laneScreen[i];
          fctx.moveTo(cx,y-2);fctx.lineTo(cx+8,y+h+4);fctx.lineTo(cx-8,y+h+4);
          fctx.closePath();fctx.fill();
        }else{
          fctx.fillStyle='rgba(255,255,255,.16)';
          fctx.fillRect(x0,y,x1-x0,h);
        }
      }
      fctx.restore();
    }
    const s=(speed-62)/34;
    if(s<=0)return;
    const W=window.innerWidth,H=window.innerHeight,cx=W*.5,cy=H*.46;
    fctx.save();fctx.globalCompositeOperation='lighter';
    fctx.strokeStyle='rgba(190,225,255,'+(.05+s*.16)+')';
    fctx.lineWidth=2;
    for(let i=0;i<26;i++){
      const a=Math.random()*6.283, r0=Math.max(W,H)*(.28+Math.random()*.2), r1=r0+40+s*120;
      fctx.beginPath();
      fctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0*.8);
      fctx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1*.8);
      fctx.stroke();
    }
    fctx.restore();
  },
  overStats(){return 'ぶち抜き '+passes+'台　最高 '+Math.round(topSpeed*3.6)+'km/h　クラッシュ '+crashes+'回';}
};
})();

let last=performance.now();
let fpsAcc=0,fpsN=0,curDPR=DPR,dprCool=0;
function frame(now){
  requestAnimationFrame(frame);
  let raw=Math.min(.05,(now-last)/1000);last=now;
  timeScale+=(tsTarget-timeScale)*(1-Math.exp(-8*raw));
  if(elapsed>slowUntil)tsTarget=1;
  const dt=raw*timeScale;
  elapsed+=dt;

  if(mode)mode.update(dt,raw);

  /* 描画負荷が高いときは解像度を落として滑らかさを優先 */
  fpsAcc+=raw;fpsN++;dprCool-=raw;
  if(fpsN>=45){
    const avg=fpsAcc/fpsN;fpsAcc=0;fpsN=0;
    if(dprCool<=0){
      if(avg>1/46&&curDPR>1){
        curDPR=Math.max(1,curDPR-.25);
        renderer.setPixelRatio(curDPR);renderer.setSize(window.innerWidth,window.innerHeight,false);
        dprCool=1.5;
      }else if(avg<1/58&&curDPR<DPR){
        curDPR=Math.min(DPR,curDPR+.25);
        renderer.setPixelRatio(curDPR);renderer.setSize(window.innerWidth,window.innerHeight,false);
        dprCool=3;
      }
    }
  }

  /* 粒子 */
  let dirty=false;
  for(let i=0;i<PMAX;i++){
    if(jLife[i]<=0)continue;
    jLife[i]-=raw;dirty=true;
    if(jLife[i]<=0){jPos[i*3+1]=-999;jCol[i*3]=jCol[i*3+1]=jCol[i*3+2]=0;continue;}
    const v=jVel[i];v.y-=G*.55*dt;v.multiplyScalar(1-Math.min(.4,1.1*dt));
    jPos[i*3]+=v.x*dt;jPos[i*3+1]+=v.y*dt;jPos[i*3+2]+=v.z*dt;
    const k=jLife[i]/jMax[i],f=k*k;
    jCol[i*3]=jBase[i*3]*f;jCol[i*3+1]=jBase[i*3+1]*f;jCol[i*3+2]=jBase[i*3+2]*f;
  }
  if(dirty){jGeo.attributes.position.needsUpdate=true;jGeo.attributes.color.needsUpdate=true;}
  dust.rotation.y+=raw*.02;

  /* カメラ（減衰補間＋シェイク） */
  if(camSnap){camCur.copy(camWant);lookCur.copy(lookWant);fovCur=fovWant;camSnap=false;}
  const kp=1-Math.exp(-camLag*raw), kl=1-Math.exp(-(camLag*.8)*raw);
  camCur.x+=(camWant.x-camCur.x)*kp;
  camCur.y+=(camWant.y-camCur.y)*kp;
  camCur.z+=(camWant.z-camCur.z)*(1-Math.exp(-(camLag*1.35)*raw));
  lookCur.x+=(lookWant.x-lookCur.x)*kl;
  lookCur.y+=(lookWant.y-lookCur.y)*kl;
  lookCur.z+=(lookWant.z-lookCur.z)*kl;
  shake*=Math.exp(-5.5*raw);
  const sh=shake*shake;
  camera.position.set(camCur.x+(Math.random()-.5)*sh*.9,
                      camCur.y+(Math.random()-.5)*sh*.9,
                      camCur.z+(Math.random()-.5)*sh*.4);
  camera.lookAt(lookCur);
  const fw=fovWant+sh*2.2;
  fovCur+=(fw-fovCur)*(1-Math.exp(-4*raw));
  if(Math.abs(camera.fov-fovCur)>.01){camera.fov=fovCur;camera.updateProjectionMatrix();}
  camRight.set(1,0,0).applyQuaternion(camera.quaternion);
  camUp.set(0,1,0).applyQuaternion(camera.quaternion);

  /* HUD */
  if(shown!==score){
    shown+=Math.max(1,Math.ceil((score-shown)*.22));
    if(shown>score)shown=score;
    scoreVal.textContent=shown;
  }
  if(elapsed>comboUntil)comboEl.classList.remove('on');
  if(elapsed>hintUntil)hintEl.classList.remove('on');

  renderer.render(scene,camera);

  fctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  fadeSplats(raw);
  if(mode&&mode.draw2d)mode.draw2d();
  drawPopups(raw);
  drawTrail();
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)last=performance.now();});

toTitle();
requestAnimationFrame(frame);
})();
</script>
